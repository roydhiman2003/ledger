/* ---------- rent logic ---------- */
function houseDues(h,from,to){
  if(!(h.rent>0))return [];
  const ds=h.freq==='fortnight'?fortDates(h.anchor,from,to):monthDates(h.day,from,to);
  return ds.map(d=>{const p=S.landlordPaid.find(x=>x.h===h.id&&x.due===d);
    const pre=h.freq==='fortnight'?d<h.anchor:d<h.start;
    return {date:d,amt:h.rent,paid:!!p||pre,pay:p}});
}
function tenantDues(t,from,to){
  return fortDates(t.anchor,from,to).map(d=>{const ps=S.rentPayments.filter(x=>x.t===t.id&&x.due===d);const pre=d<t.anchor;const got=pre?t.rent:ps.reduce((s,x)=>s+x.amt,0);
    return {date:d,amt:t.rent,got,left:Math.max(0,t.rent-got),paid:pre||got>=t.rent,pay:ps[0]}});
}
function tenantStatus(t){
  const today=todayISO();
  const dues=tenantDues(t,t.anchor,addDays(today,28));
  const over=dues.filter(x=>!x.paid&&x.date<=today);
  const next=dues.find(x=>!x.paid&&x.date>today);
  return {over,overAmt:over.reduce((s,x)=>s+x.left,0),next,unpaid:dues.filter(x=>!x.paid)};
}
function houseStatus(h){
  const today=todayISO();
  const dues=houseDues(h,h.freq==='fortnight'?h.anchor:h.start,addDays(today,62));
  const unpaid=dues.filter(x=>!x.paid);
  return {unpaid,over:unpaid.filter(x=>x.date<=today),next:unpaid[0]};
}
function monthProfit(ym){
  if(ym<S.trackStart)return {rows:S.houses.map(h=>({h,exp:0,got:0,cost:0,paid:0,bills:0,profit:0})),personal:0,self:0,exp:0,got:0,cost:0,paid:0,profit:0,before:true};
  const [y,m]=ym.split('-').map(Number);const from=`${ym}-01`,to=`${ym}-${pad(daysIn(y,m))}`;
  const rows=S.houses.map(h=>{
    let exp=0,got=0;h.tenants.forEach(t=>tenantDues(t,from,to).forEach(d=>{exp+=d.amt;got+=d.got}));
    let cost=0,paid=0;houseDues(h,from,to).forEach(d=>{cost+=d.amt;if(d.paid)paid+=d.pay?d.pay.amt:d.amt});
    const inM=x=>x.iso>=from&&x.iso<=to;let bills=S.bills.filter(b=>b.h===h.id&&inM(b)).reduce((s,b)=>s+b.amt,0);
    if(h.kind==='car')bills+=S.carCosts.filter(c=>inM(c)&&carOf(c).use==='rented').reduce((s,c)=>s+c.amt,0);
    cost+=bills;paid+=bills;
    return {h,exp,got,cost,paid,bills,profit:exp-cost};
  });
  const sum=k=>rows.reduce((s,r)=>s+r[k],0);
  return {rows,personal:S.carCosts.filter(c=>c.iso>=from&&c.iso<=to&&carOf(c).use!=='rented').reduce((s,c)=>s+c.amt,0),self:rows.filter(r=>r.h.self&&r.profit<0).reduce((s,r)=>s-r.profit,0),exp:sum('exp'),got:sum('got'),cost:sum('cost'),paid:sum('paid'),profit:sum('profit')};
}
function avgMonthly(){
  const per=S.houses.map(h=>{const inc=h.tenants.reduce((s,t)=>s+t.rent,0)*26/12;const cost=h.freq==='fortnight'?h.rent*26/12:h.rent;return {h,inc,cost,p:inc-cost}});
  return {per,total:per.reduce((s,x)=>s+x.p,0)};
}

function sheet(html,onSubmit){
  const el=document.getElementById('sheet');
  el.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=el.querySelector('form');if(f)f.addEventListener('submit',ev=>{ev.preventDefault();onSubmit&&onSubmit(Object.fromEntries(new FormData(f)),f)});
  const i=el.querySelector('input:not([type=radio]):not([type=hidden])');if(i)setTimeout(()=>i.focus(),50);
}
function closeSheet(){document.getElementById('sheet').innerHTML=''}

  ${list?`<div class="fld" style="font-size:14px;color:var(--ink)">Paid two ways? Part paid another way (optional)<input name="amt2" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 480" style="margin-top:4px">${viaChips('via2','cash')}</div>`:''}
  ${dateF(p.iso)}${actions('Save')}</form>`,
  d=>{const a2=list?(+d.amt2||0):0;
    if(a2&&a2>=T){toast('The second part must be less than '+money(T));return}
    const a1=T-a2;
    commit(a2?`${name}: ${num(T)} split into ${num(a1)} ${accName(d.via)} + ${num(a2)} ${accName(d.via2)}`:`${name}: ${num(T)} payment set to ${accName(d.via)}`,()=>{
      if(old){adjust(old,-sign*T);adjust(d.via,sign*a1);if(a2)adjust(d.via2,sign*a2)}
      p.via=d.via;p.iso=d.iso;

/* ---------- bills & cars ---------- */
function addMonths(s,n){let[y,m,d]=s.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}-${pad(Math.min(d,daysIn(y,m)))}`}
const daysTo=s=>toN(s)-toN(todayISO());
const monthRange=ym=>{const[y,m]=ym.split('-').map(Number);return [ym+'-01',`${ym}-${pad(daysIn(y,m))}`]};
const monthLabel=ym=>new Date(toN(ym+'-01')*864e5).toLocaleDateString('en-AU',{month:'long',year:'numeric',timeZone:'UTC'});
function chipsOf(name,opts,sel){return `<div class="chips">${opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o)}" ${o===sel?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`}

function carStatus(c){
  const rd=daysTo(c.regoExpiry);
  const rego={days:rd,cls:rd<0?'bad':rd<=21?'soon':'ok',txt:rd<0?`Rego expired ${fmtDs(c.regoExpiry)}`:rd===0?'Rego expires today':`Rego to ${fmtDs(c.regoExpiry)} · ${rd} days left`};
  let svc;
  if(c.odo==null||c.lastServiceKm==null)svc={cls:'n',txt:'Add km to track service',left:null};
  else{const next=c.lastServiceKm+c.serviceEvery,left=next-c.odo;svc={cls:left<=0?'bad':left<=1000?'soon':'ok',txt:left<=0?`Service overdue by ${num(-left)} km`:`Next service at ${num(next)} km · ${num(left)} km left`,left,next}}
  let ins=null;if(c.insExpiry){const d=daysTo(c.insExpiry);ins={days:d,cls:d<0?'bad':d<=21?'soon':'ok',txt:d<0?`Insurance expired ${fmtDs(c.insExpiry)}`:`Insurance to ${fmtDs(c.insExpiry)} · ${d} days left`}}
  return {rego,svc,ins};
}

/* ---------- monthly report ---------- */
function flows(from,to){
  const out=[],inR=x=>x.iso>=from&&x.iso<=to;
  S.rentPayments.filter(p=>!p.pre&&inR(p)).forEach(p=>{const h=S.houses.find(x=>x.id===p.h);out.push({cat:h&&h.kind==='car'?'Car rent in':'House rent in',amt:p.amt,via:p.via})});
  S.entries.forEach(e=>e.payments.filter(inR).forEach(p=>out.push({cat:e.side==='get'?'Loans paid back to you':'You paid back loans',amt:e.side==='get'?p.amt:-p.amt,via:p.via})));
  S.moves.filter(inR).forEach(m=>out.push({cat:m.amt<0?'Money you lent':'Money you borrowed',amt:m.amt,via:m.via}));
  S.landlordPaid.filter(p=>!p.pre&&inR(p)).forEach(p=>out.push({cat:'Landlord rent',amt:-p.amt,via:p.via}));
  S.bills.filter(inR).forEach(b=>out.push({cat:'House bills',amt:-b.amt,via:b.via}));
  S.carCosts.filter(inR).forEach(c=>out.push({cat:carOf(c).use==='rented'?'Rented car costs':'Personal car costs',amt:-c.amt,via:c.via}));
  return out;
}
const CAT_ORDER=['House rent in','Car rent in','Loans paid back to you','Money you borrowed','Landlord rent','House bills','Rented car costs','Personal car costs','Money you lent','You paid back loans'];
function monthSum(ym){const [f,t]=monthRange(ym);const fl=flows(f,t);const inn=fl.filter(x=>x.amt>0).reduce((s,x)=>s+x.amt,0),out=-fl.filter(x=>x.amt<0).reduce((s,x)=>s+x.amt,0);return {fl,inn,out,net:inn-out}}
function vReport(){
  const ms=monthSum(month);
  const cats=CAT_ORDER.map(c=>[c,ms.fl.filter(x=>x.cat===c).reduce((s,x)=>s+x.amt,0)]).filter(x=>x[1]);
  const accs=[...liquid().map(a=>[a.id,a.name]),['offset','Taken off debt'],['','Not set']].map(([id,n])=>{const f=ms.fl.filter(x=>(x.via||'')===id&&(id===''||true));
    const inn=f.filter(x=>x.amt>0).reduce((s,x)=>s+x.amt,0),out=-f.filter(x=>x.amt<0).reduce((s,x)=>s+x.amt,0);return {n,inn,out}}).filter(a=>a.inn||a.out);
  const known=new Set(liquid().map(a=>a.id).concat(['']));const other=ms.fl.filter(x=>!known.has(x.via||''));
  if(other.length){const inn=other.filter(x=>x.amt>0).reduce((s,x)=>s+x.amt,0),out=-other.filter(x=>x.amt<0).reduce((s,x)=>s+x.amt,0);accs.push({n:'Other accounts',inn,out})}
  const months=[];let [y,m]=month.split('-').map(Number);for(let i=0;i<6;i++){months.unshift(`${y}-${pad(m)}`);m--;if(!m){m=12;y--}}
  const rows=months.map(k=>({k,...monthSum(k),p:monthProfit(k).profit}));const mx=Math.max(1,...rows.map(r=>Math.abs(r.net)));
  return `<section><div class="sec-h"><h2>Monthly report</h2></div><div class="card" style="display:grid;gap:12px">
  <div class="monthnav"><button class="btn sm" data-act="mprev" aria-label="Previous month">‹</button><b>${monthLabel(month)}</b><button class="btn sm" data-act="mnext" aria-label="Next month">›</button></div>
  <div class="stats"><div class="stat"><span class="label">Money in</span><b class="pos">${money(ms.inn)}</b></div><div class="stat"><span class="label">Money out</span><b class="neg">${money(ms.out)}</b></div><div class="stat"><span class="label">Net</span><b class="${ms.net>=0?'pos':'neg'}">${money(ms.net)}</b></div></div>
  <div><span class="label">By type</span><div class="tablewrap"><table class="ptable"><tbody>${cats.map(([c,v])=>`<tr><td>${c}</td><td class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${money(v)}</td></tr>`).join('')||'<tr><td class="mut">Nothing recorded this month.</td><td></td></tr>'}</tbody></table></div></div>
  <div><span class="label">By account</span><div class="tablewrap"><table class="ptable"><thead><tr><th>Account</th><th>In</th><th>Out</th><th>Net</th></tr></thead><tbody>${accs.map(a=>`<tr><td>${esc(a.n)}</td><td>${money(a.inn)}</td><td>${money(a.out)}</td><td class="${a.inn-a.out>=0?'pos':'neg'}">${money(a.inn-a.out)}</td></tr>`).join('')||'<tr><td class="mut" colspan="4">Nothing recorded this month.</td></tr>'}</tbody></table></div></div>
  <div><span class="label">Last 6 months</span><div class="tablewrap"><table class="ptable"><thead><tr><th>Month</th><th>In</th><th>Out</th><th>Net</th><th>Profit</th></tr></thead><tbody>${rows.map(r=>`<tr${r.k===month?' style="font-weight:700"':''}><td>${new Date(toN(r.k+'-01')*864e5).toLocaleDateString('en-AU',{month:'short',year:'2-digit',timeZone:'UTC'})}</td><td>${money(r.inn)}</td><td>${money(r.out)}</td><td class="${r.net>=0?'pos':'neg'}">${money(r.net)}<div class="bar" style="margin-top:3px"><i style="width:${Math.abs(r.net)/mx*100}%;${r.net<0?'background:var(--owe)':''}"></i></div></td><td>${r.k<S.trackStart?'<span class="mut">–</span>':money(r.p)}</td></tr>`).join('')}</tbody></table></div>
  <div class="mut" style="font-size:12px;margin-top:6px">In and Out count money that moved this month, including loans. Profit is expected rent profit (rent in minus rent, bills and rented car costs). Manual balance edits are not counted.</div></div>
  </div></section>`;
}

/* ---------- events ---------- */
function toast(t){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>el.innerHTML='',2200)}
async function copyText(t,ta){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){if(ta){ta.focus();ta.select()}toast('Select the text and copy it')}}
function restore(txt){try{const d=JSON.parse(txt);if(!d.entries)throw 0;const snap=JSON.stringify({...S,undo:null});S=migrate(d);S.undo={label:'Restore backup',snap};save();render();toast('Backup restored')}catch(e){toast('That is not a valid backup')}}

document.addEventListener('click',ev=>{
  const tb=ev.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;closeSheet();render();scrollTo(0,0);return}
  const sd=ev.target.closest('[data-side]');if(sd){peopleSide=sd.dataset.side;render();return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,h=el.dataset.h;
  if(a==='close'){if(el.classList.contains('scrim')&&ev.target!==el)return;closeSheet();return}
  ({
    person:()=>personSheet(id),pay:()=>paySheet(id),more:()=>moreSheet(id),editPerson:()=>editPersonSheet(id),addPerson:()=>editPersonSheet(),
    delPerson:()=>{const e=S.entries.find(x=>x.id===id);confirmSheet(`Delete ${e.name}?`,'Delete',()=>commit(`Deleted ${e.name}`,()=>S.entries=S.entries.filter(x=>x.id!==id)))},
    editPay:()=>{const e=S.entries.find(x=>x.id===id);methodSheet(e.payments[+el.dataset.i],e.side==='get'?1:-1,e.name,e.payments)},
    editRent:()=>{const p=S.rentPayments.find(x=>x.id===id);const t=S.houses.flatMap(h=>h.tenants).find(x=>x.id===p.t);methodSheet(p,1,t?t.name:'rent')},
    delPay:()=>{const e=S.entries.find(x=>x.id===id),i=+el.dataset.i,p=e.payments[i];confirmSheet(`Remove ${money(p.amt)} payment?`,'Remove',()=>commit(`Removed ${num(p.amt)} payment (${e.name})`,()=>{e.payments.splice(i,1);adjust(p.via,e.side==='get'?-p.amt:p.amt);if(p.rid)S.rentPayments=S.rentPayments.filter(x=>x.id!==p.rid)}))},
    remindOne:()=>{const e=S.entries.find(x=>x.id===id);closeSheet();tab='remind';render();toast('Find '+first(e.name)+' under Money to collect')},
    acc:()=>accSheet(id),addAcc:()=>accSheet(),
    delAcc:()=>{const x=S.assets.find(z=>z.id===id);confirmSheet(`Delete ${x.name}?`,'Delete',()=>commit(`Deleted account ${x.name}`,()=>S.assets=S.assets.filter(z=>z.id!==id)))},
    mprev:()=>{let[y,m]=month.split('-').map(Number);m--;if(!m){m=12;y--}month=`${y}-${pad(m)}`;render()},
    mnext:()=>{let[y,m]=month.split('-').map(Number);m++;if(m>12){m=1;y++}month=`${y}-${pad(m)}`;render()},
    rentIn:()=>rentInSheet(h,id),tenant:()=>tenantSheet(h,id),editTenant:()=>editTenantSheet(h,id),addTenant:()=>editTenantSheet(h),
    delTenant:()=>{const {h:hs,t}=findT(h,id);confirmSheet(`Remove ${t.name} from ${hs.name}?`,'Remove',()=>commit(`Removed tenant ${t.name}`,()=>hs.tenants=hs.tenants.filter(x=>x.id!==id)))},
    delRent:()=>{const p=S.rentPayments.find(x=>x.id===id);confirmSheet(`Remove ${money(p.amt)} rent payment?`,'Remove',()=>commit(`Removed rent payment ${num(p.amt)}`,()=>{S.rentPayments=S.rentPayments.filter(x=>x.id!==id);adjust(p.via,-p.amt);if(p.via==='offset')S.entries.forEach(e=>e.payments=e.payments.filter(x=>x.rid!==p.id))}))},
    addBill:()=>billSheet(h),
    delBill:()=>{const b=S.bills.find(x=>x.id===id);confirmSheet(`Remove ${b.type} bill ${money(b.amt)}?`,'Remove',()=>commit(`Removed ${b.type} bill ${num(b.amt)}`,()=>{S.bills=S.bills.filter(x=>x.id!==id);adjust(b.via,b.amt)}))},
    carCost:()=>carCostSheet(id,el.dataset.type),carKm:()=>carKmSheet(id),editCar:()=>editCarSheet(id),addCar:()=>editCarSheet(),
    delCar:()=>{const c=S.cars.find(x=>x.id===id);confirmSheet(`Delete car ${c.plate}?`,'Delete',()=>commit(`Deleted car ${c.plate}`,()=>S.cars=S.cars.filter(x=>x.id!==id)))},
    delCarCost:()=>{const x=S.carCosts.find(z=>z.id===id);const c=carOf(x);confirmSheet(`Remove ${x.type} ${money(x.amt)}?`,'Remove',()=>commit(`Removed ${c.plate||'car'} ${x.type} ${num(x.amt)}`,()=>{S.carCosts=S.carCosts.filter(z=>z.id!==id);adjust(x.via,x.amt);if(x.type==='Rego'&&x.prevRego&&c.id)c.regoExpiry=x.prevRego;if(x.type==='Service'&&x.prevSvc!==undefined&&c.id)c.lastServiceKm=x.prevSvc}))},
    payLandlord:()=>payLandlordSheet(id),editHouse:()=>editHouseSheet(id),addHouse:()=>editHouseSheet(),
    delHouse:()=>{const x=S.houses.find(z=>z.id===id);confirmSheet(`Delete ${x.name}?`,'Delete',()=>commit(`Deleted house ${x.name}`,()=>S.houses=S.houses.filter(z=>z.id!==id)))},
    phone:()=>phoneSheet(el.dataset.name),
    copy:()=>copyText(document.getElementById(el.dataset.src).textContent),
    undo:()=>undo(),
    pinOn:()=>pinSheet(),lockNow:()=>showLock(),
    pinOff:()=>confirmSheet('Turn off the PIN?','Turn off',()=>{pinHash=null;try{localStorage.removeItem(PINKEY)}catch(e){}closeSheet();render();toast('PIN is off')}),
    backup:()=>{S.lastBackup=todayISO();save();const t=JSON.stringify(S);const ta=document.getElementById('bktext');ta.value=t;copyText(t,ta);render();document.getElementById('bktext').value=t},
    pasteRestore:()=>{const t=document.getElementById('bktext').value.trim();if(!t){toast('Paste a backup in the box first');return}confirmSheet('Replace all data with this backup?','Restore',()=>{closeSheet();restore(t)})}
  }[a]||(()=>{}))();
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){q=ev.target.value;const l=document.getElementById('plist');
  const list=S.entries.filter(e=>e.side===peopleSide&&e.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(remOf(b)>0)-(remOf(a)>0)||remOf(b)-remOf(a));
  l.innerHTML=list.map(personRow).join('')||'<div class="empty">No match.</div>'}});
document.addEventListener('change',ev=>{if(ev.target.id==='bkfile'&&ev.target.files[0]){const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(ev.target.files[0])}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});

/* ---------- PIN lock ---------- */
const PINKEY='dhiman-ledger-pin';let pinHash=null,pinBuf='';try{pinHash=localStorage.getItem(PINKEY)}catch(e){}
function hpin(s){let h=2166136261;for(const c of 'dhiman-ledger:'+s+':pin'){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function showLock(){pinBuf='';document.getElementById('view').innerHTML='';document.getElementById('lock').innerHTML=`<div class="lock"><div><h2>Dhiman Ledger</h2><div class="mut" style="margin-top:4px">Enter your PIN</div><div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'del'].map(k=>k===''?'<span></span>':`<button type="button" data-pin="${k}" aria-label="${k==='del'?'Delete':k}">${k==='del'?'⌫':k}</button>`).join('')}</div>
  <button type="button" class="btn sm" data-pin="forgot">Forgot PIN</button></div></div>`}
function pinPress(k){
  if(k==='forgot'){document.getElementById('lock').innerHTML=`<div class="lock"><div style="max-width:340px"><h2>Forgot PIN</h2><p class="mut">The only way in is to erase the data on this phone and start again. Then restore your latest backup from Report &amp; more.</p><div class="btns" style="justify-content:center"><button type="button" class="btn" data-pin="back">Go back</button><button type="button" class="btn pri" style="background:var(--owe);border-color:var(--owe)" data-pin="erase">Erase and start again</button></div></div></div>`;return}
  if(k==='back'){showLock();return}
  if(k==='erase'){try{localStorage.removeItem(PINKEY);localStorage.removeItem(KEY)}catch(e){}pinHash=null;S=migrate(JSON.parse(JSON.stringify(SEED)));save();document.getElementById('lock').innerHTML='';tab='more';render();toast('Erased. Restore your backup below.');return}
  pinBuf=k==='del'?pinBuf.slice(0,-1):(pinBuf+k).slice(0,4);
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
  if(pinBuf.length===4){if(hpin(pinBuf)===pinHash){document.getElementById('lock').innerHTML='';render()}else{const d=document.getElementById('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');pinBuf='';setTimeout(()=>document.querySelectorAll('#dots i').forEach(i=>i.classList.remove('on')),300)}}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-pin]');if(b)pinPress(b.dataset.pin)});
function pinSheet(){
  sheet(`<h2>Set a PIN</h2><div class="sub">4 numbers. Write it down. If you forget it, you need your backup to get back in.</div>
  <form class="f"><div class="two"><label>New PIN<input name="p1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label><label>Type it again<input name="p2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label></div>${actions('Turn on PIN')}</form>`,
  d=>{if(!/^\d{4}$/.test(d.p1)){toast('Use 4 numbers');return}if(d.p1!==d.p2){toast('The two PINs do not match');return}
    pinHash=hpin(d.p1);try{localStorage.setItem(PINKEY,pinHash)}catch(e){}closeSheet();render();toast('PIN is on')});
}
function vPin(){return `<section><div class="sec-h"><h2>PIN lock</h2></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
  <span>${pinHash?'PIN is <b class="pos">on</b>. The app asks for it when it opens.':'<span class="mut">No PIN. Anyone with your phone can open this.</span>'}</span>
  <div class="btns">${pinHash?'<button class="btn sm" data-act="lockNow">Lock now</button><button class="btn sm dan" data-act="pinOff">Turn off</button>':'<button class="btn sm pri" data-act="pinOn">Set PIN</button>'}</div></div></div></section>`}

save();if(pinHash)showLock();else render();
</script>
