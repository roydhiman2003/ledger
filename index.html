<meta name="description" content="Roy's personal money, rent and car ledger">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling column, fixed bottom tab bar, bottom sheets for forms */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --sunk:#E3EAE6; --ink:#13201B; --muted:#5A6A63; --line:#D5DFDA;
  --accent:#0E6A55; --accent-ink:#FFFFFF; --get:#127A4E; --owe:#B3412D; --warn:#A8690F;
  --get-bg:#DDF0E5; --owe-bg:#F7E1DC; --warn-bg:#F6EBD5; --hl-bg:#FFE36E; --hl-ink:#4A3A00;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201C; --sunk:#1D2925; --ink:#E4EDE8; --muted:#92A39B; --line:#28362F;
  --accent:#49BE9C; --accent-ink:#06120E; --get:#4FC48D; --owe:#EF7C64; --warn:#E2AC4D;
  --get-bg:#173126; --owe-bg:#36201B; --warn-bg:#33291A; --hl-bg:#5C4A0E; --hl-ink:#FFE79A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201C; --sunk:#1D2925; --ink:#E4EDE8; --muted:#92A39B; --line:#28362F;
  --accent:#49BE9C; --accent-ink:#06120E; --get:#4FC48D; --owe:#EF7C64; --warn:#E2AC4D;
  --get-bg:#173126; --owe-bg:#36201B; --warn-bg:#33291A; --hl-bg:#5C4A0E; --hl-ink:#FFE79A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:0 96px;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
header.top h1{font-size:20px}
header.top .nw{text-align:right;font-size:12px;color:var(--muted)}
header.top .nw b{display:block;font-family:var(--display);font-size:18px;color:var(--ink)}
.save-warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
section{display:grid;gap:12px;margin-bottom:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:17px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .main .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.rowbtn{background:none;border:0;padding:0;text-align:left;color:inherit}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.quick .btn{padding:9px 4px}
.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-inline:16px;text-align:center}
.lock h2{font-size:22px}.dots{display:flex;gap:14px;justify-content:center;margin-top:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,66px);gap:12px;justify-content:center;margin:20px 0}.pad button{height:66px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bills{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.pos{color:var(--get)} .neg{color:var(--owe)} .mut{color:var(--muted)}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px 16px 12px}
.hero .big{font-family:var(--display);font-size:34px;line-height:1.1}
.hero .sub{opacity:.85;font-size:13px}
.hero svg{display:block;width:100%;height:56px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:17px;margin-top:2px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--get-bg);color:var(--get)} .pill.bad{background:var(--owe-bg);color:var(--owe)} .pill.soon{background:var(--warn-bg);color:var(--warn)} .pill.n{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dan{color:var(--owe)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:5px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--get)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.house-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.house-h h3{font-size:17px}
.house-h .s{font-size:12.5px;color:var(--muted)}
.landlord{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
.tenants{margin-top:10px;border-top:1px solid var(--line)}
.tenants .row{padding-inline:0}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--display);font-size:17px}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th,.ptable td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}
.ptable th:first-child,.ptable td:first-child{text-align:left}

body{background:

/* staggered entrance for lists */
@media all{
 .list>.row,.accgrid>.acc,.quick>.qa,.stats>.stat{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
 .list>.row:nth-child(2),.accgrid>.acc:nth-child(2),.quick>.qa:nth-child(2),.stats>.stat:nth-child(2){animation-delay:.04s}
 .list>.row:nth-child(3),.accgrid>.acc:nth-child(3),.quick>.qa:nth-child(3),.stats>.stat:nth-child(3){animation-delay:.08s}
 .list>.row:nth-child(4),.accgrid>.acc:nth-child(4),.quick>.qa:nth-child(4){animation-delay:.12s}
 .list>.row:nth-child(5),.accgrid>.acc:nth-child(5){animation-delay:.16s}
 .list>.row:nth-child(n+6),.accgrid>.acc:nth-child(6){animation-delay:.2s}
 nav.tabs button.on svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
}

@media all{.mc-bars i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}.mc-col:nth-child(2) .mc-bars i{animation-delay:.06s}.mc-col:nth-child(3) .mc-bars i{animation-delay:.12s}.mc-col:nth-child(4) .mc-bars i{animation-delay:.18s}.mc-col:nth-child(5) .mc-bars i{animation-delay:.24s}}

.mc-labels{display:flex;gap:6px;margin:8px 0 0 34px}

/* ===== v10: people cards, 3D ===== */

:root[data-theme="dark"] .pcard{background:linear-gradient(155deg,hsl(var(--h) 30% 15%) 0%,var(--surface) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 30px -16px rgba(0,0,0,.7)}
.pcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 6px 6px 0;background:var(--sc,var(--get))}
.pcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px 120px at var(--mx,120%) 0%,rgba(255,255,255,.35),transparent 70%);opacity:.9;transition:opacity .3s}
.pcard.get{--sc:linear-gradient(180deg,#2BD3A1,var(--get));--rc:var(--get)}

.pcard.done{--sc:var(--line);--rc:var(--get);opacity:.85}
.pcard:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 24px 40px -18px rgba(16,40,32,.4)}
.pcard:active{transform:perspective(900px) rotateX(3deg) scale(.985)!important}
.pc-main{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.pc-av{flex:none;border-radius:50%;padding:3px;background:conic-gradient(var(--rc,var(--get)) calc(var(--p)*1%),color-mix(in srgb,var(--line) 70%,transparent) 0);box-shadow:0 8px 18px -8px var(--rc,var(--get))}

.pc-txt{flex:1;min-width:0;display:grid;gap:2px}
.pc-name{font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pc-amt{flex:none;text-align:right;font-family:var(--display);font-size:20px;line-height:1.1;letter-spacing:-.01em}
.pc-amt small{display:block;font-family:var(--body);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:2px}
.pc-rent{margin-top:8px;padding-left:63px}
.pc-foot{display:flex;align-items:center;gap:12px;margin-top:12px;padding-left:63px}
.pc-prog{flex:1;min-width:0;display:grid;gap:5px}

.pc-bar{height:8px;border-radius:9px;background:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);overflow:hidden}
.pc-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2BD3A1,var(--rc,var(--get)));box-shadow:0 0 10px color-mix(in srgb,var(--rc,var(--get)) 60%,transparent);position:relative;overflow:hidden}

@media all{.pc-bar i{animation:barfill 1s cubic-bezier(.2,.8,.2,1) both .15s}
 .pcards>.pcard{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
 .pcards>.pcard:nth-child(2){animation-delay:.05s}.pcards>.pcard:nth-child(3){animation-delay:.1s}.pcards>.pcard:nth-child(4){animation-delay:.15s}.pcards>.pcard:nth-child(5){animation-delay:.2s}.pcards>.pcard:nth-child(n+6){animation-delay:.25s}}

/* raised 3D buttons */
.act3d{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:9px 14px 9px 11px;font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(180deg,#2BD3A1,#0F7A61);box-shadow:0 4px 0 #0A5546,0 12px 20px -10px rgba(10,85,70,.8),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s,box-shadow .12s}

  background:linear-gradient(120deg,#16A57E,#0A5546,#0C3D5C,#16A57E);background-size:300% 300%;animation:heroflow 14s ease infinite;box-shadow:0 16px 30px -18px rgba(10,85,70,.9)}

.phero::after{pointer-events:none;content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}

  background:radial-gradient(closest-side,rgba(0,0,0,.18) 76%,transparent 78% 100%),conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.22) 0)}

@media (max-width:360px){.pc-rent,.pc-foot{padding-left:0}.pc-amt{font-size:17px}.ph-ring{display:none}}

/* ===== v11: 3D everywhere ===== */

  border:1px solid color-mix(in srgb,var(--line) 60%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 20px -14px rgba(16,40,32,.35);transition:transform .3s cubic-bezier(.2,.8,.2,1)}

/* ===== ROY'S LEDGER 2.0 · mobile-first design system ===== */
:root{--r:20px;--bg:#F4F7F6;--surface:#FFFFFF;--sunk:#E9F0ED;--ink:#12271F;--muted:#667B72;--line:#DCE7E2;--accent:#09785F;--get:#097F5B;--owe:#C54C44;--grad:linear-gradient(130deg,#0D9875,#09654F 62%,#084638);--shadow:0 3px 12px rgba(12,54,42,.035),0 16px 32px -26px rgba(8,59,42,.25)}

.hero svg{height:70px;opacity:.95}
.card,.list,.stat,.acc{border-radius:20px}
section{gap:12px;margin-bottom:24px}

.btn{min-height:37px}.btn.pri{background:var(--grad)}

.sheet{border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:91dvh;overscroll-behavior-y:contain}
.scrim{background:rgba(4,20,15,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}

.pcard,.hcard,.salary{border-radius:22px}

@media(hover:hover){button:hover{filter:brightness(1.025)}}

/* ===== ROY'S LEDGER — ORIGINAL "TIDELINE" MOBILE DESIGN (2026) =====
   Custom-made finance interface, intentionally framework-free and private. */
:root{
  --bg:#F3F6F2;--surface:#FFFFFF;--sunk:#E8F0E9;--ink:#102824;--muted:#6B8079;
  --line:#E1E9E4;--accent:#127963;--get:#137C63;--owe:#C85E4F;--warn:#A66B23;
  --get-bg:#E2F3EA;--owe-bg:#FCECE6;--warn-bg:#F9EFDC;
  --grad:linear-gradient(135deg,#1A9075,#0D5147 70%,#0B2C2B);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Avenir Next",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;

let MOTION=!matchMedia('(prefers-reduced-motion: reduce)').matches;try{const pref=localStorage.getItem('dhiman-ledger-motion');if(pref!==null)MOTION=pref!=='0'}catch(e){}document.documentElement.classList.toggle('nomotion',!MOTION);

function fortDates(anchor,from,to){const a=toN(anchor),f=toN(from),t=toN(to);const out=[];for(let n=a+14*Math.ceil((f-a)/14);n<=t;n+=14)out.push(fromN(n));return out}

if(!S||!S.entries) { let cleared=false;try{cleared=localStorage.getItem(WIPEKEY)==='1'}catch(e){} S=migrate(JSON.parse(JSON.stringify(cleared||!SEED?EMPTY_LEDGER:SEED))); }

const ORDER=['cash','ing','westpac','commbank'];
const isCashAcc=a=>/cash/i.test(a.id+' '+a.name);const cashOnly=()=>S.assets.filter(a=>a.liquid&&isCashAcc(a)).reduce((s,a)=>s+a.amount,0),bankOnly=()=>S.assets.filter(a=>a.liquid&&!isCashAcc(a)).reduce((s,a)=>s+a.amount,0);const rank=a=>{const i=ORDER.findIndex(o=>a.id.startsWith(o));return i<0?9:i};

  const assets=S.assets.reduce((s,a)=>s+a.amount,0);
  const get=S.entries.filter(e=>e.side==='get').reduce((s,e)=>s+Math.max(0,remOf(e)),0)+allRentOver();
  const owe=S.entries.filter(e=>e.side==='owe').reduce((s,e)=>s+Math.max(0,remOf(e)),0);

}

  const t=totals(),d=todayISO(),iv=r2(S.assets.filter(a=>!a.liquid).reduce((s,a)=>s+a.amount,0)),row={nw:r2(t.nw),cash:r2(t.cash),inv:iv,cs:r2(cashOnly()),bk:r2(bankOnly())};const h=S.history.find(x=>x.d===d);if(h)Object.assign(h,row);else S.history.push({d,...row});

}
function commit(label,fn){
  const snap=JSON.stringify({...S,undo:null});
  fn();

  S.log.unshift({iso:new Date().toISOString(),text:label});S.log=S.log.slice(0,400);

/* multi-step undo: last 15 changes this session; the newest one also survives a reload */
var UNDOS=[];
function undoList(){if(UNDOS.length)return UNDOS;return S.undo?[{label:S.undo.label,snap:S.undo.snap}]:[]}
function undo(){const L=undoList();if(!L.length){toast('Nothing to undo');return}const u=L[L.length-1];
  if(UNDOS.length)UNDOS.pop();const l=u.label;S=migrate(JSON.parse(u.snap));const prev=UNDOS[UNDOS.length-1];S.undo=prev?{label:prev.label,snap:prev.snap}:null;
  S.log.unshift({iso:new Date().toISOString(),text:'Undid: '+l});S.backupDirty=true;save();closeSheet();render();toast('Undid: '+l)}

/* ---------- rent logic ---------- */
function houseDues(h,from,to){
  if(!(h.rent>0))return [];
  const ds=h.freq==='fortnight'?fortDates(h.anchor,from,to):monthDates(h.day,from,to);
  return ds.map(d=>{const ps=S.landlordPaid.filter(x=>x.h===h.id&&x.due===d);
    const pre=h.freq==='fortnight'?d<h.anchor:d<h.start;const R=rentAt(h,d),got=pre?R:Math.round(ps.reduce((s,x)=>s+x.amt,0)*100)/100;
    return {date:d,amt:R,got,left:Math.max(0,Math.round((R-got)*100)/100),paid:pre||got>=R-0.009,pay:ps[0],pays:ps}});
}
const FREQ={week:{l:'week',n:'Weekly',m:52/12},fortnight:{l:'fortnight',n:'Fortnightly',m:26/12},month:{l:'month',n:'Monthly',m:1}};
const tf=t=>FREQ[t.freq]?t.freq:'fortnight';
const perMonth=t=>t.rent*FREQ[tf(t)].m;
function stepDates(anchor,from,to,k){const a=toN(anchor),f=toN(from),t=toN(to);const out=[];for(let n=a+k*Math.ceil((f-a)/k);n<=t;n+=k)out.push(fromN(n));return out}
function tDates(t,from,to){return tf(t)==='month'?monthDates(+t.anchor.slice(8,10),from,to):stepDates(t.anchor,from,to,tf(t)==='week'?7:14)}
const wday=s=>new Date(toN(s)*864e5).toLocaleDateString('en-AU',{weekday:'long',timeZone:'UTC'});
const schedText=t=>tf(t)==='month'?`on the ${+t.anchor.slice(8)}${ord(+t.anchor.slice(8))} each month`:tf(t)==='week'?`every ${wday(t.anchor)}`:`every 2nd ${wday(t.anchor)}`;
function incomeText(ts){const fs=[...new Set(ts.map(tf))];if(fs.length<=1){return money(ts.reduce((s,t)=>s+t.rent,0))+' / '+FREQ[fs[0]||'fortnight'].l}return 'about '+money(ts.reduce((s,t)=>s+perMonth(t),0))+' / month'}
/* rent can change over time: x.prev = [{until:date, rent:old}] keeps the old rent for dates before 'until' */
const rentAt=(x,d)=>{const p=(x.prev||[]).filter(r=>d<r.until).sort((a,b)=>a.until<b.until?-1:1)[0];return p?p.rent:x.rent};
function tenantDues(t,from,to){
  return tDates(t,from,to).map(d=>{const R=rentAt(t,d),ps=S.rentPayments.filter(x=>x.t===t.id&&x.due===d);const pre=d<t.anchor;const got=pre?R:Math.round(ps.reduce((s,x)=>s+x.amt,0)*100)/100;
    return {date:d,amt:R,got,left:Math.max(0,Math.round((R-got)*100)/100),paid:pre||got>=R-0.009,pay:ps[0]}});
}
function tenantStatus(t){
  const today=todayISO();
  const dues=tenantDues(t,t.anchor,addDays(today,35));
  const over=dues.filter(x=>!x.paid&&x.date<=today);
  const next=dues.find(x=>!x.paid&&x.date>today);
  return {over,overAmt:over.reduce((s,x)=>s+x.left,0),next,unpaid:dues.filter(x=>!x.paid)};
}
function houseStatus(h){
  const today=todayISO();
  const dues=houseDues(h,h.freq==='fortnight'?h.anchor:h.start,addDays(today,62));
  const unpaid=dues.filter(x=>!x.paid);
  return {unpaid,over:unpaid.filter(x=>x.date<=today),next:unpaid[0]};
}
function monthProfit(ym){
  if(ym<S.trackStart)return {rows:S.houses.map(h=>({h,exp:0,got:0,cost:0,paid:0,bills:0,profit:0})),personal:0,self:0,home:{rows:[],exp:0,cost:0,net:0},exp:0,got:0,cost:0,paid:0,profit:0,before:true};
  const [y,m]=ym.split('-').map(Number);const from=`${ym}-01`,to=`${ym}-${pad(daysIn(y,m))}`;
  const rows=S.houses.map(h=>{
    let exp=0,got=0;h.tenants.forEach(t=>tenantDues(t,from,to).forEach(d=>{exp+=d.amt;got+=d.got}));
    shareDues(h.id,from,to).forEach(x=>{exp+=x.amt;if(x.got)got+=x.got.amt});
    let cost=0,paid=0;houseDues(h,from,to).forEach(d=>{cost+=d.amt;paid+=d.got});
    const inM=x=>x.iso>=from&&x.iso<=to;let bills=S.bills.filter(b=>b.h===h.id&&inM(b)).reduce((s,b)=>s+b.amt,0);
    if(h.kind==='car')bills+=S.carCosts.filter(c=>inM(c)&&carOf(c).use==='rented').reduce((s,c)=>s+c.amt,0);
    S.recurring.filter(r=>r.h===h.id).forEach(r=>recDates(r,from,to).forEach(d=>{if(!recPaid(r,d))bills+=r.amt}));
    cost+=bills;paid+=S.bills.filter(b=>b.h===h.id&&inM(b)&&bPaid(b)).reduce((s,b)=>s+b.amt,0)+(h.kind==='car'?bills:0);
    return {h,exp,got,cost,paid,bills,profit:exp-cost};
  });
  const biz=rows.filter(r=>!r.h.self),home=rows.filter(r=>r.h.self),sum=k=>biz.reduce((s,r)=>s+r[k],0),hs=k=>home.reduce((s,r)=>s+r[k],0);
  return {rows,home:{rows:home,exp:hs('exp'),cost:hs('cost'),net:hs('cost')-hs('exp')},personal:S.carCosts.filter(c=>c.iso>=from&&c.iso<=to&&carOf(c).use!=='rented').reduce((s,c)=>s+c.amt,0),self:Math.max(0,hs('cost')-hs('exp')),exp:sum('exp'),got:sum('got'),cost:sum('cost'),paid:sum('paid'),profit:sum('profit')};
}
function avgMonthly(){
  const per=S.houses.filter(h=>!h.self).map(h=>{const inc=h.tenants.reduce((s,t)=>s+perMonth(t),0);const cost=h.freq==='fortnight'?h.rent*26/12:h.rent;return {h,inc,cost,p:inc-cost}});
  return {per,total:per.reduce((s,x)=>s+x.p,0)};
}

const hue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return h};
const avRing=(n,pct,o)=>`<span class="ring${o?' o':''}" style="--p:${Math.round(pct)}">${av(n)}</span>`;
const av=n=>{const p=String(n).trim().split(/\s+/);return `<span class="av" style="--h:${hue(n)}" aria-hidden="true">${esc((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:''))}</span>`};
/* ---------- missed rent counts as money owed ---------- */
const nk=n=>(n||'').toLowerCase().trim();
/* people are linked by name (loan ↔ tenant ↔ phone ↔ bill shares), so a rename must update every place the old name is used */
function renamePerson(oldN,newN){const o=nk(oldN);if(!o||o===nk(newN))return;const fix=x=>{if(x&&nk(x.name)===o)x.name=newN};
  S.entries.forEach(fix);S.houses.forEach(h=>h.tenants.forEach(fix));
  S.recurring.forEach(r=>(r.split||[]).forEach(fix));S.bills.forEach(b=>(b.split||[]).forEach(fix));(S.shareIn||[]).forEach(fix);
  S.moves.forEach(m=>{if(nk(m.who)===o)m.who=newN});S.msgs.forEach(m=>{if(nk(m.who)===o)m.who=newN});
  S.cars.forEach(c=>{if(nk(c.renter)===o)c.renter=newN});
  if(S.contacts[o]!==undefined){if(!S.contacts[nk(newN)])S.contacts[nk(newN)]=S.contacts[o];delete S.contacts[o]}}
function rentOwed(name){const k=nk(name),out=[];S.houses.forEach(h=>h.tenants.forEach(t=>{if(nk(t.name)!==k)return;tenantStatus(t).over.forEach(x=>out.push({h,t,date:x.date,left:x.left}))}));return out.sort((a,b)=>a.date<b.date?-1:1)}
function rentPool(name){const k=nk(name),out=[];S.houses.forEach(h=>h.tenants.forEach(t=>{if(nk(t.name)!==k)return;tenantStatus(t).unpaid.forEach(x=>out.push({h,t,date:x.date,left:x.left}))}));return out.sort((a,b)=>a.date<b.date?-1:1)}
const sumLeft=a=>a.reduce((s,x)=>s+x.left,0);
const allRentOver=()=>S.houses.reduce((s,h)=>s+h.tenants.reduce((a,t)=>a+tenantStatus(t).overAmt,0),0);
const totalOf=e=>Math.max(0,remOf(e))+(e.side==='get'?sumLeft(rentOwed(e.name)):0);
function virtuals(){const have=new Set(S.entries.filter(e=>e.side==='get').map(e=>nk(e.name))),seen=new Set(),out=[];

  L.push(`Hi ${first(e.name)}, here is what you owe me as of ${fmtD(todayISO())}:`);

  const pi=planInfo(e);if(pi&&!pi.done)L.push('',`Our plan: $${n2(pi.pl.amt)} ${PLAN_EVERY[pi.pl.every][0].toLowerCase()}.`,pi.behind>0?`You are $${n2(pi.behind)} behind on the plan.`:pi.next?`Next plan payment: $${n2(pi.nextAmt)} on ${fmtD(pi.next)}.`:'',`At this rate it is paid off by ${fmtD(pi.end)}.`);

const lbl=(h,a)=>h.kind==='car'?`your car rent of $${num(a)}`:`your rent of $${num(a)} for ${h.address.split(',')[0]}`;
function buildReminders(){
  const today=todayISO(),soon=addDays(today,3),out={over:[],soon:[],debts:[],bills:[]};
  S.houses.forEach(h=>h.tenants.forEach(t=>{const st=tenantStatus(t);
    if(st.over.length){const ds=st.over.map(x=>fmtDs(x.date)).join(', ');
      out.over.push({name:t.name,amt:st.overAmt,sub:`${h.name} · overdue since ${fmtDs(st.over[0].date)}`,
        text:`Hi ${first(t.name)}, a friendly reminder that ${lbl(h,st.overAmt)} is overdue (due ${ds}).${owedByName(t.name)>st.overAmt?` With this, you owe me $${num(owedByName(t.name))} in total.`:''} Please pay as soon as you can. Thanks!`})}
    else if(st.next&&st.next.date<=soon){
      out.soon.push({name:t.name,amt:st.next.left,sub:`${h.name} · due ${fmtD(st.next.date)}`,
        text:`Hi ${first(t.name)}, just a reminder that ${lbl(h,st.next.left)} is due on ${fmtD(st.next.date)}. Thanks!`})}
  }));
  planDue(today,soon).filter(x=>x.e.side==='get').forEach(x=>{const n=first(x.e.name);
    (x.over?out.over:out.soon).push({name:x.e.name,amt:x.amt,sub:x.over?`Payment plan · behind since ${fmtDs(x.date)}`:`Payment plan · due ${fmtD(x.date)}`,
      text:x.over?`Hi ${n}, a friendly reminder that your plan payment of $${n2(x.amt)} is overdue (we agreed $${n2(x.pi.pl.amt)} ${PLAN_EVERY[x.pi.pl.every][0].toLowerCase()}). You still owe me $${num(owedByName(x.e.name))} in total. Please pay as soon as you can. Thanks!`:`Hi ${n}, just a reminder that your next plan payment of $${n2(x.amt)} is due on ${fmtD(x.date)}. Thanks!`})});
  S.entries.filter(e=>e.side==='get'&&totalOf(e)>0).sort((a,b)=>totalOf(b)-totalOf(a)).forEach(e=>{const ro=sumLeft(rentOwed(e.name));
    out.debts.push({name:e.name,amt:totalOf(e),sub:(e.payments.length?`Last paid ${fmtDs(e.payments[e.payments.length-1].iso)}`:'No payments yet')+(ro?` · includes ${money(ro)} rent`:''),
      text:`Hi ${first(e.name)}, hope you're well. Just a reminder that $${num(totalOf(e))} is still outstanding${ro?` (this includes $${num(ro)} rent not paid)`:''}. Please let me know when you can pay. Thanks!`})});
  S.houses.forEach(h=>{const st=houseStatus(h);st.unpaid.filter(x=>x.date<=addDays(today,7)).forEach(x=>out.bills.push({h,d:x}))});
  return out;
}

 return rows.length?rows.slice(0,15).join(''):'<div class="empty">Nothing matching that search.</div>';

  el.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=el.querySelector('form');if(f)f.addEventListener('submit',ev=>{ev.preventDefault();onSubmit&&onSubmit(Object.fromEntries(new FormData(f)),f)});
  const i=el.querySelector('input:not([type=radio]):not([type=hidden])');if(i)setTimeout(()=>i.focus(),50);

function viaPick(name='via',sel){const L=liquid();
  return `<div class="vp">${viaChips(name,sel)}${L.length>1?`<label class="sp-tg"><input type="checkbox" name="split" value="1"><span>${ic('swap')} Split between accounts (e.g. cash + bank)</span></label>

const n2=n=>Math.abs(n-Math.round(n))<0.005?num(n):(Math.round(n*100)/100).toFixed(2);
const sumP=ps=>Math.round(ps.reduce((s,p)=>s+p.amt,0)*100)/100;
const PO=x=>x&&x.parts&&x.parts.length?x.parts:[{via:x?x.via:'',amt:x?x.amt:0}];
const viaLbl=x=>{const ps=PO(x);return ps.length>1?ps.map(p=>accName(p.via)+' '+n2(p.amt)).join(' + '):accName(ps[0].via)};
const pL=ps=>ps.length>1?' · '+ps.map(p=>accName(p.via)+' '+n2(p.amt)).join(' + '):(ps[0]&&ps[0].via?' · '+accName(ps[0].via):'');
function readParts(d,total){total=Math.round((+total||0)*100)/100;
  if(!d.split){if(!total){toast('Enter an amount');return null}return [{via:d.via||'',amt:total}]}
  const ps=liquid().map(a=>({via:a.id,amt:Math.round((+d['sp_'+a.id]||0)*100)/100})).filter(p=>p.amt>0);
  if(!ps.length){toast('Enter how much went to each account');return null}
  const s=sumP(ps);if(total&&Math.abs(s-total)>0.009){toast(`The split adds up to $${n2(s)}, but the amount is $${n2(total)}. Fix one of them.`);return null}
  return ps}
function allocate(items,ps){const left=ps.map(p=>({...p})),out=[];
  items.forEach(it=>{let need=Math.round(it.amt*100)/100;for(const p of left){if(need<=0.004)break;if(p.amt<=0.004)continue;const a=Math.round(Math.min(need,p.amt)*100)/100;out.push({it,via:p.via,amt:a});p.amt=Math.round((p.amt-a)*100)/100;need=Math.round((need-a)*100)/100}});
  return out}
function spUpdate(f){if(!f)return;const box=f.querySelector('.spbox');if(!box||box.hidden)return;const tot=+(f.querySelector('[name=amt]')||{}).value||0;
  const s=[...box.querySelectorAll('input[data-acc]')].reduce((a,i)=>a+(+i.value||0),0),left=Math.round((tot-s)*100)/100;
  box.querySelectorAll('input[data-acc]').forEach(i=>i.placeholder=!i.value&&left>0?n2(left):'0');
  const el=box.querySelector('.sp-sum');el.className='sp-sum '+(Math.abs(left)<0.01?'ok':left>0?'n':'bad');
  el.textContent=!tot?`Total of parts: $${n2(s)}`:Math.abs(left)<0.01?`✓ Adds up to $${n2(tot)}`:left>0?`$${n2(left)} still to split`:`$${n2(-left)} too much`}

function paySheet(id){
  const e=getEntry(id),get=e.side==='get';
  const roA=get?sumLeft(rentOwed(e.name)):0,loan=Math.max(0,remOf(e)),total=get?loan+roA:remOf(e);
  sheet(`<h2>${get?esc(first(e.name))+' paid you':'You paid '+esc(first(e.name))}</h2><div class="sub">Still ${get?'owed':'to pay'}: ${money(total)}${roA&&loan?` (rent ${money(roA)} + loan ${money(loan)})`:''}</div>
  <form class="f">${amtF('')}${total>0?`<div class="quickamt"><button type="button" class="btn sm" data-act="fillAmt" data-v="${r2(total)}">All ${money(total)}</button>${roA&&loan?`<button type="button" class="btn sm" data-act="fillAmt" data-v="${r2(roA)}">Rent only ${money(roA)}</button>`:''}</div>`:''}
  ${roA&&loan?`<div class="fld">Put this toward<div class="chips"><label><input type="radio" name="mode" value="rent" checked><span>Rent first, then loan</span></label><label><input type="radio" name="mode" value="loan"><span>Loan only</span></label></div></div>`:''}
  <div class="fld" style="font-size:14px;color:var(--ink)">${get?'How did they pay you? Bank, cash, or split':'Paid from'}${viaPick()}</div>${dateF()}${actions('Save payment')}</form>`,
  d=>{const ps=readParts(d,d.amt);if(!ps)return;const amt=sumP(ps);
    if(!get){if(amt>Math.max(0,remOf(e))+0.009){toast(`That is more than you owe ${first(e.name)} (${money(Math.max(0,remOf(e)))}). Check the amount.`);return}
      commit(`Paid ${e.name} ${n2(amt)}${pL(ps)}`,()=>{ps.forEach(p=>{e.payments.push({amt:p.amt,iso:d.iso,via:p.via});adjust(p.via,-p.amt)})});
      const left=Math.max(0,remOf(e)),st=sentText(ps.length>1?ps:ps[0].via);receiptSheet(e.name,`Hi ${first(e.name)}, I have sent you $${n2(amt)}${st?' '+st:''} on ${fmtD(d.iso)}. ${left>0?`I still owe you $${num(left)}.`:'That clears what I owe you.'} Thank you!`,'Tell '+esc(first(e.name))+' you paid');return}

    if(plan.extra>0){toast(`That is ${money(plan.extra)} more than ${first(e.name)} owes. Check the amount.`);return}
    const parts=[...plan.rent.map(x=>`${x.h.kind==='car'?'car rent':'rent'} ${n2(x.amt)}`),plan.loan&&plan.rent.length?`loan ${n2(plan.loan)}`:''].filter(Boolean);
    const items=[...plan.rent.map(x=>({k:'rent',x,amt:x.amt})),...(plan.loan?[{k:'loan',amt:plan.loan}]:[])];
    commit(`${e.name} paid ${n2(amt)}${parts.length?' ('+parts.join(' + ')+')':''}${pL(ps)}`,()=>{
      allocate(items,ps).forEach(a=>{if(a.it.k==='rent')S.rentPayments.push({id:uid('r'),t:a.it.x.t.id,h:a.it.x.h.id,due:a.it.x.date,amt:a.amt,via:a.via,iso:d.iso});else e.payments.push({amt:a.amt,iso:d.iso,via:a.via})});
      ps.forEach(p=>adjust(p.via,p.amt))});

    receiptSheet(e.name,receiptText(e.name,amt,ps.length>1?ps:ps[0].via,d.iso,what));
    if(wasLoan&&remOf(e)<=0){confetti();setTimeout(()=>toast(`${first(e.name)} has paid back everything`),300)}});

function methodSheet(p,sign,name,list){
  const old=p.via,T=p.amt;
  sheet(`<h2>Change payment</h2><div class="sub">${money(T)} on ${fmtD(p.iso)} · ${esc(name)}. ${old?'Your account balances update to match.':'Old payment from before tracking: balances stay the same.'}</div>
  <form class="f">${amtF(T,'Amount')}<div class="fld" style="font-size:14px;color:var(--ink)">${sign>0?'How did they pay you?':'Paid from'}${viaChips('via',old||(liquid()[0]||{}).id)}</div>
  ${list?`<div class="fld" style="font-size:14px;color:var(--ink)">Paid two ways? Amount paid another way (optional)<input name="amt2" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 300" style="margin-top:4px">${viaChips('via2','cash')}<span style="font-weight:500;font-size:12px">This part is taken out of the amount above and saved as a second payment.</span></div>`:''}
  ${dateF(p.iso)}${actions('Save')}</form>`,
  d=>{const A=Math.round((+d.amt||0)*100)/100,a2=list?Math.round((+d.amt2||0)*100)/100:0;
    if(!(A>0)){toast('Enter an amount');return}
    if(a2&&a2>=A){toast('The second part must be less than '+money(A));return}
    if(a2&&d.via2===d.via){toast('Pick a different account for the second part');return}
    const a1=Math.round((A-a2)*100)/100,ch=[];if(A!==T)ch.push(`amount ${n2(T)} → ${n2(A)}`);if(d.via!==old)ch.push(`account → ${accName(d.via)}`);if(d.iso!==p.iso)ch.push(`date → ${fmtDs(d.iso)}`);
    if(!ch.length&&!a2){closeSheet();return}
    commit(a2?`${name}: ${n2(A)} split into ${n2(a1)} ${accName(d.via)} + ${n2(a2)} ${accName(d.via2)}`:`${name}: payment changed (${ch.join(', ')})`,()=>{
      if(old){adjust(old,-sign*T);adjust(d.via,sign*a1);if(a2)adjust(d.via2,sign*a2)}

function addMonths(s,n){let[y,m,d]=s.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}-${pad(Math.min(d,daysIn(y,m)))}`}

  d=>{const ps=readParts(d,d.amt);if(!ps)return;const amt=sumP(ps);commit(`Paid ${b.type} bill ${n2(amt)} (${h.name||''})${pL(ps)}`,()=>{b.paid=undefined;b.paidIso=d.iso;b.via=ps[0].via;b.parts=ps.length>1?ps:undefined;b.amt=amt;ps.forEach(p=>adjust(p.via,-p.amt))})})}
function billStats(h){const [from,to]=monthRange(month);const now=month===todayISO().slice(0,7);const bs=S.bills.filter(b=>b.h===h.id&&(b.iso>=from&&b.iso<=to||now&&!bPaid(b)&&b.iso<from));const unpaid=bs.filter(b=>!bPaid(b)&&!b.rec);

  const mustHTML=st.must.map(({r,d,paid})=>{const sh=st.sh.filter(x=>x.r.id===r.id&&x.date===d),mine=Math.max(0,r2(r.amt-recSplitSum(r))),left=sh.filter(x=>!x.got).reduce((a,x)=>a+x.amt,0);

    <div class="btns" style="flex-wrap:nowrap">${pd?'':`<button class="btn sm pri" data-act="payBill" data-id="${b.id}">Pay</button>`}<button class="btn sm dan icon" data-act="delBill" data-id="${b.id}" aria-label="Remove">✕</button></div></div>
    ${sh.length?`<div class="bc-split"><span>Split ${sh.length+(b.splitMe?1:0)} ways</span><span>${m2(sh[0].amt)} each</span><span class="${left?'pos':''}">${left?m2(left)+' to collect':'All collected'}</span></div>${sh.map(shareRow).join('')}<div class="btns"><button class="btn sm" data-act="groupMsg" data-id="b:${b.id}" data-d="${b.iso}">Message group</button></div>`:''}</div>`}).join('');
  sheet(`<h2>Bills · ${esc(h.name)}</h2><div class="sub">${monthLabel(month)}${st.left?' · '+m2(st.left)+' still to collect from tenants':''}</div>

function carStatus(c){
  const rd=daysTo(c.regoExpiry);
  const rego={days:rd,cls:rd<0?'bad':rd<=21?'soon':'ok',txt:rd<0?`Rego expired ${fmtDs(c.regoExpiry)}`:rd===0?'Rego expires today':`Rego to ${fmtDs(c.regoExpiry)} · ${rd} days left`};
  let svc;
  if(c.odo==null||c.lastServiceKm==null)svc={cls:'n',txt:'Add km to track service',left:null};
  else{const next=c.lastServiceKm+c.serviceEvery,left=next-c.odo;svc={cls:left<=0?'bad':left<=1000?'soon':'ok',txt:left<=0?`Service overdue by ${num(-left)} km`:`Next service at ${num(next)} km · ${num(left)} km left`,left,next}}
  let ins=null;if(c.insExpiry){const d=daysTo(c.insExpiry);ins={days:d,cls:d<0?'bad':d<=21?'soon':'ok',txt:d<0?`Insurance expired ${fmtDs(c.insExpiry)}`:`Insurance to ${fmtDs(c.insExpiry)} · ${d} days left`}}
  return {rego,svc,ins};
}

const m2=n=>HIDE?'$•••':Math.abs(n-Math.round(n))<0.005?money(n):(n<0?'−$':'$')+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});

  const got=S.shareIn.find(x=>x.rec===r.id&&x.due===d&&nk(x.name)===nk(p.name));out.push({r,date:d,name:p.name,amt:p.amt,got})})));return out}
function payDays(from,to){const j=S.job;if(!j||!j.anchor)return [];return stepDates(j.anchor,from,to,14).filter(d=>d>=(j.start||j.anchor))}
const payGot=d=>S.expenses.find(x=>x.kind==='in'&&x.payDue===d);
function jobAvg(){const j=S.job;const a=[...(j.history||[]).map(x=>x.amt),...S.expenses.filter(x=>x.payDue).sort((p,q)=>p.iso<q.iso?-1:1).map(x=>x.amt)].slice(-6);
  const v=a.length?a.reduce((s,x)=>s+x,0)/a.length:(j.minPay+j.maxPay)/2;return Math.round(Math.min(j.maxPay||v,Math.max(j.minPay||0,v)))}
function planData(ym){

}
function cashWarnings(){const today=todayISO(),lim=addDays(today,14),need={};

  S.cars.forEach(c=>{if(c.insExpiry&&c.insExpiry<=lim&&c.insExpiry>=addDays(today,-31))add(c.insVia,c.insCost||0,`${c.insName||'Insurance'} ${c.plate}`,c.insExpiry);
    if(c.regoExpiry<=lim&&c.regoExpiry>=addDays(today,-31))add(c.regoVia,c.regoCost||0,`Rego ${c.plate}`,c.regoExpiry)});
  // landlord rent can be paid from any bank account, so it is checked against all bank accounts together
  const rent={amt:0,items:[]};S.houses.filter(h=>h.rent>0).forEach(h=>houseDues(h,addDays(today,-31),lim).filter(x=>!x.paid).forEach(x=>{rent.amt+=x.left;rent.items.push({t:`${h.name} rent`,d:x.date,amt:x.left})}));
  const out=Object.entries(need).map(([id,n])=>{const a=S.assets.find(x=>x.id===id);return a&&n.amt>a.amount?{a,n,short:n.amt-a.amount}:null}).filter(Boolean);
  // rent: warn only if all bank accounts together are short (after the fixed bills above)
  const fixedFromBank=Object.entries(need).filter(([id])=>{const a=S.assets.find(x=>x.id===id);return a&&a.liquid&&!isCashAcc(a)}).reduce((s,[,n])=>s+n.amt,0),bank=r2(bankOnly());
  if(rent.amt>0&&rent.amt+fixedFromBank>bank+0.009)out.push({a:{id:'',name:'Your bank accounts',amount:bank},n:{amt:r2(rent.amt+fixedFromBank),items:[...rent.items,...Object.entries(need).filter(([id])=>{const a=S.assets.find(x=>x.id===id);return a&&a.liquid&&!isCashAcc(a)}).flatMap(([,n])=>n.items)]},short:r2(rent.amt+fixedFromBank-bank),any:true});

function flows(from,to){
  const out=[],inR=x=>x.iso>=from&&x.iso<=to;
  S.rentPayments.filter(p=>!p.pre&&inR(p)).forEach(p=>{const h=S.houses.find(x=>x.id===p.h);out.push({cat:h&&h.kind==='car'?'Car rent in':'House rent in',amt:p.amt,via:p.via})});
  S.entries.forEach(e=>e.payments.filter(inR).forEach(p=>out.push({cat:e.side==='get'?'Loans paid back to you':'You paid back loans',amt:e.side==='get'?p.amt:-p.amt,via:p.via})));
  S.moves.filter(inR).forEach(m=>out.push({cat:m.amt<0?'Money you lent':'Money you borrowed',amt:m.amt,via:m.via}));
  S.landlordPaid.filter(p=>!p.pre&&inR(p)).forEach(p=>out.push({cat:'Landlord rent',amt:-p.amt,via:p.via}));
  S.bills.filter(b=>bPaid(b)&&inR({iso:bPayDate(b)})).forEach(b=>PO(b).forEach(p=>out.push({cat:'House bills',amt:-p.amt,via:p.via})));
  (S.shareIn||[]).filter(inR).forEach(x=>PO(x).forEach(p=>out.push({cat:'Bill shares in',amt:p.amt,via:p.via})));
  S.carCosts.filter(inR).forEach(c=>PO(c).forEach(p=>out.push({cat:carOf(c).use==='rented'?'Rented car costs':'Personal car costs',amt:-p.amt,via:p.via})));
  S.expenses.filter(inR).forEach(x=>PO(x).forEach(p=>out.push({cat:x.cat,amt:x.kind==='in'?p.amt:-p.amt,via:p.via,exp:x.kind!=='in'})));
  return out;
}
const CAT_ORDER=['House rent in','Car rent in','Loans paid back to you','Money you borrowed','Landlord rent','House bills','Rented car costs','Personal car costs','Money you lent','You paid back loans'];
function monthSum(ym){const [f,t]=monthRange(ym);const fl=flows(f,t);const inn=fl.filter(x=>x.amt>0).reduce((s,x)=>s+x.amt,0),out=-fl.filter(x=>x.amt<0).reduce((s,x)=>s+x.amt,0);return {fl,inn,out,net:inn-out}}
function printMonth(){const old=HIDE;HIDE=false;try{
  const ms=monthSum(month),mp=monthProfit(month),t=totals();

  const getL=S.entries.filter(e=>e.side==='get').concat(virtuals()).filter(e=>totalOf(e)>0).sort((a,b)=>totalOf(b)-totalOf(a));
  const oweL=S.entries.filter(e=>e.side==='owe'&&remOf(e)>0);
  document.getElementById('print').innerHTML=`<h1>Roy's Ledger · ${monthLabel(month)}</h1><div class="m">Made on ${fmtD(todayISO())}</div>
  <h2>Summary</h2><div class="g"><div>Money in<b>${money(ms.inn)}</b></div><div>Money out<b>${money(ms.out)}</b></div><div>Net<b>${money(ms.net)}</b></div><div>Rent profit<b>${mp.before?'–':money(mp.profit)}</b></div></div>
  <h2>Rent by house</h2><table><thead><tr><th>Source</th><th>Rent in</th><th>Costs</th><th>Profit</th></tr></thead><tbody>${mp.rows.filter(r=>!r.h.self).map(r=>`<tr><td>${esc(r.h.name)}</td><td>${money(r.exp)}</td><td>${money(r.cost)}</td><td>${money(r.profit)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${money(mp.exp)}</b></td><td><b>${money(mp.cost)}</b></td><td><b>${money(mp.profit)}</b></td></tr></tbody></table>

  <h2>People who owe me · ${money(t.get)}</h2><table><tbody>${getL.map(e=>{const ro=sumLeft(rentOwed(e.name));return `<tr><td>${esc(e.name)}${ro?` <span class="m">(includes ${money(ro)} missed rent)</span>`:''}</td><td>${money(totalOf(e))}</td></tr>`}).join('')}</tbody></table>

  }finally{HIDE=old}
  setTimeout(()=>window.print(),60)}
const CAT_INFO={
 'House rent in':{l:'House rent received',ic:'house'},'Car rent in':{l:'Car rent received',ic:'car'},
 'Loans paid back to you':{l:'Loans paid back to you',ic:'in'},'Money you borrowed':{l:'Money you borrowed',ic:'in'},
 'Landlord rent':{l:'Rent you paid landlords',ic:'house'},'House bills':{l:'House bills',ic:'bolt'},
 'Rented car costs':{l:'Rented car costs',ic:'car'},'Personal car costs':{l:'Your own car costs',ic:'car'},

function stepM(k,n){let [y,m]=k.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}`}
function spendDonut(ms){const m={};ms.fl.filter(x=>x.exp).forEach(x=>{m[x.cat]=(m[x.cat]||0)-x.amt});const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]),tot=arr.reduce((s,x)=>s+x[1],0);
  if(!tot)return `<section><div class="sec-h"><h2>Your spending</h2></div><div class="card empty">No spending recorded this month. Tap <b>Spend</b> on Home to add groceries, fuel, tuition and more.</div></section>`;
  let acc=0;const seg=arr.map(([c,v])=>{const a0=acc/tot*360;acc+=v;return `${spendCol(c)} ${a0.toFixed(1)}deg ${(acc/tot*360).toFixed(1)}deg`}).join(',');
  return `<section><div class="sec-h"><h2>Your spending</h2><span class="pill n">${money(tot)}</span></div><div class="card donutcard"><div class="donut" style="background:conic-gradient(${seg})"><div><span>Spent</span><b>${money(tot)}</b></div></div>
  <div class="dleg">${arr.map(([c,v])=>`<div><i style="background:${spendCol(c)}"></i><span>${CAT_EMO[c]||''} ${esc(c)}</span><b>${money(v)}</b><em>${Math.round(v/tot*100)}%</em></div>`).join('')}</div></div></section>`}
function vReport(){
  const ms=monthSum(month),mp=monthProfit(month),pk=stepM(month,-1),prev=pk>=S.trackStart?monthSum(pk):null;
  const short=k=>new Date(toN(k+'-01')*864e5).toLocaleDateString('en-AU',{month:'short',timeZone:'UTC'});
  const group=sign=>{const m={};ms.fl.filter(x=>sign>0?x.amt>0:x.amt<0).forEach(x=>{m[x.cat]=m[x.cat]||{v:0,n:0};m[x.cat].v+=Math.abs(x.amt);m[x.cat].n++});return Object.entries(m).sort((a,b)=>b[1].v-a[1].v)};
  const ins=group(1),outs=group(-1);
  const pm=sign=>{const m={};if(prev)prev.fl.filter(x=>sign>0?x.amt>0:x.amt<0).forEach(x=>{m[x.cat]=(m[x.cat]||0)+Math.abs(x.amt)});return m},pIn=pm(1),pOut=pm(-1);
  const vs=(c,v,kind)=>{if(!prev)return '';const o=(kind==='in'?pIn:pOut)[c]||0;if(!o)return ` · <span class="rvs new">new vs ${short(pk)}</span>`;const dd=v-o;if(Math.abs(dd)<1)return ` · <span class="rvs">same as ${short(pk)}</span>`;const good=kind==='in'?dd>0:dd<0;return ` · <span class="rvs ${good?'good':'bad'}">${dd>0?'▲':'▼'} ${money(Math.abs(dd))} vs ${short(pk)}</span>`};
  const catList=(arr,tot,kind)=>arr.length?arr.map(([c,o])=>{const inf=CAT_INFO[c]||{l:c,ic:kind};const ic=CAT_EMO[c]?`<span class="emo">${CAT_EMO[c]}</span>`:inf.ic==='bolt'?BOLT:QI[inf.ic]||QI[kind];const pc=tot?Math.round(o.v/tot*100):0;
    return `<div class="rc-row"><span class="rc-ic ${kind}">${ic}</span><div class="rc-main"><div class="rc-top"><b>${esc(inf.l)}</b><span class="${kind==='in'?'pos':'neg'}">${kind==='in'?'+':'−'}${money(o.v)}</span></div><div class="rc-bar ${kind}"><i style="width:${Math.max(3,pc)}%"></i></div><span class="rc-pc">${pc}% · ${o.n} payment${o.n>1?'s':''}${vs(c,o.v,kind)}</span></div></div>`}).join('')
    :`<div class="empty">${kind==='in'?'No money came in this month yet.':'No money went out this month yet.'}</div>`;
  // accounts
  const [mf,mt]=monthRange(month),mtr=S.transfers.filter(t=>t.iso>=mf&&t.iso<=mt);
  const af=ms.fl.concat(mtr.flatMap(t=>[{via:t.from,amt:-t.amt},{via:t.to,amt:t.amt}]));
  const accs=allAccs().map(a=>{const f=af.filter(x=>(x.via||'')===a.id);return {a,inn:f.filter(x=>x.amt>0).reduce((s,x)=>s+x.amt,0),out:-f.filter(x=>x.amt<0).reduce((s,x)=>s+x.amt,0)}}).filter(x=>x.inn||x.out);

  return `<section><div class="mnav" style="margin-bottom:12px"><button class="btn sm" data-act="mprev" aria-label="Previous month">‹</button><b>${monthLabel(month)}</b><button class="btn sm" data-act="mnext" aria-label="Next month">›</button></div><div class="sec-h rep-h"><h2>Money this month</h2><div class="btns"><button class="btn sm" data-act="csv">${ic('file')} Spreadsheet</button><button class="btn sm pri" data-act="printMonth">Save as PDF</button></div></div>
  <div class="rhero"><span class="rh-l">${isNow?`So far this month · day ${dayN} of ${daysIn(+month.slice(0,4),+month.slice(5,7))}`:month>todayISO().slice(0,7)?'Nothing has happened yet':'Money left after everything'}</span><b class="rh-big">${ms.net>=0?'+':'−'}${money(Math.abs(ms.net))}</b>
    ${isNow&&mp.exp?`<span class="rh-chg">Rent still to come: ${money(Math.max(0,mp.rows.reduce((a,r)=>a+r.exp-r.got,0)))}</span>`:''}${diff!==null?`<span class="rh-chg">${diff>=0?'▲':'▼'} ${money(Math.abs(diff))} vs ${short(pk)}</span>`:''}
    <div class="rh-tiles"><div><span>${QI.in} Money in</span><b>${money(ms.inn)}</b></div><div><span>${QI.out} Money out</span><b>${money(ms.out)}</b></div></div></div>
  <div class="card rsent">${sentence}</div>
  ${!mp.before?`<div class="card rprofit"><div class="rp-top"><div><span class="label">Rent profit this month</span><b class="${mp.profit>=0?'pos':'neg'}">${money(mp.profit)}</b></div><div class="rp-io"><span>Rent due <b>${money(mp.exp)}</b></span><span>Costs <b>${money(mp.cost)}</b></span></div></div>

const PLAN_EVERY={week:['Weekly',7],fortnight:['Every 2 weeks',14],month:['Monthly',0]};
function planDates(pl,from,to){if(from>to)return [];return pl.every==='month'?monthDates(+pl.start.slice(8),from,to):stepDates(pl.start,from,to,PLAN_EVERY[pl.every]?PLAN_EVERY[pl.every][1]:14).filter(d=>d>=pl.start)}
function planInfo(e){const pl=e.plan;if(!pl||!(pl.amt>0)||e.virtual)return null;const today=todayISO(),left=Math.max(0,remOf(e));if(left<=0)return {done:true,pl};
  const dueDates=planDates(pl,pl.start,today),paid=e.payments.filter(p=>p.iso>=pl.start).reduce((s,p)=>s+p.amt,0);
  const exp=Math.min(dueDates.length*pl.amt,pl.base||Infinity),behind=Math.max(0,Math.min(left,Math.round((exp-paid)*100)/100));
  const fut=planDates(pl,addDays(today,1),addMonths(today,60)),next=fut[0];
  const k=Math.ceil(Math.max(0,left-behind)/pl.amt),end=k?fut[Math.min(fut.length-1,k-1)]:today;
  return {pl,left,behind,next,nextAmt:Math.min(pl.amt,Math.max(0,left-behind)),end,count:k,lastDue:dueDates[dueDates.length-1]}}

  let d;try{d=JSON.parse(txt.slice(a,b+1))}catch(e){throw new Error('The backup text is broken or cut off. Copy the whole text again.')}
  if(!d||typeof d!=='object'||Array.isArray(d)||!Array.isArray(d.entries)||!Array.isArray(d.assets))throw new Error('This file is not a Roy\'s Ledger backup.');
  const arr=['entries','assets','log','history','houses','rentPayments','landlordPaid','bills','carCosts','moves','cars','msgs','transfers','expenses','recurring','shareIn','valLog','trades'];
  for(const k of arr)if(d[k]!==undefined&&!Array.isArray(d[k]))throw new Error('Backup has an invalid '+k+' section.');
  const validNum=n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=1e12;
  const validStr=x=>typeof x==='string'&&x.length<=10000;
  for(const e of d.entries){if(!e||!validStr(e.id)||!e.id||!validStr(e.name)||!['get','owe'].includes(e.side)||!validNum(e.amount)||e.amount<0||e.payments!==undefined&&!Array.isArray(e.payments))throw new Error('Backup has an invalid person or loan.');
    for(const p of e.payments||[])if(!p||!validNum(p.amt)||p.amt<0||!validStr(p.iso))throw new Error('Backup has an invalid loan payment.');}
  for(const a of d.assets)if(!a||!validStr(a.id)||!a.id||!validStr(a.name)||!validNum(a.amount))throw new Error('Backup has an invalid account balance.');
  for(const h of d.houses||[]){if(!h||!validStr(h.id)||!validStr(h.name)||!Array.isArray(h.tenants)||!validNum(h.rent)||h.rent<0)throw new Error('Backup has an invalid house.');
    for(const t of h.tenants)if(!t||!validStr(t.id)||!validStr(t.name)||!validStr(t.anchor)||!validNum(t.rent)||t.rent<0)throw new Error('Backup has an invalid tenant.');}
  for(const k of ['rentPayments','landlordPaid','bills','carCosts','shareIn','transfers','expenses'])for(const r of d[k]||[])if(!r||!validNum(r.amt)||r.amt<0)throw new Error('Backup has an invalid amount in '+k+'.');
  if(d.contacts!==undefined&&(!d.contacts||typeof d.contacts!=='object'||Array.isArray(d.contacts)))throw new Error('Backup has invalid contacts.');
  return d
}

function pinPress(k){
  if(k==='forgot'){document.getElementById('lock').innerHTML=`<div class="lock"><div style="max-width:340px"><h2>Forgot PIN</h2><p class="mut">You can erase the locally saved ledger and its on-phone safety copies, then restore a private JSON backup. No ledger data is built into this file, so after erasing you start empty until you restore a backup.</p><div class="btns" style="justify-content:center"><button type="button" class="btn" data-pin="back">Go back</button><button type="button" class="btn pri" style="background:var(--owe);border-color:var(--owe)" data-pin="erase">Erase and start again</button></div></div></div>`;return}
  if(k==='back'){showLock();return}

  pinBuf=k==='del'?pinBuf.slice(0,-1):(pinBuf+k).slice(0,4);
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
  if(pinBuf.length===4){if(hpin(pinBuf)===pinHash){document.getElementById('lock').innerHTML='';render()}else{const d=document.getElementById('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');pinBuf='';setTimeout(()=>document.querySelectorAll('#dots i').forEach(i=>i.classList.remove('on')),300)}}
}
