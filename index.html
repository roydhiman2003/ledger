.summary .chipbox span{font-size:11.5px;color:var(--muted);font-weight:600}
.bkbox{background:var(--sunk);border-radius:12px;padding:10px 12px}
/* ---- v6: transfers, clear pay actions, polish ---- */
.btn svg,.act svg,.done svg,.qi svg,.tr-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.quick{grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--ink);transition:transform .1s}
.qa:active{transform:scale(.96)}
.qi{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.qi svg{width:20px;height:20px}
.qi.in{background:var(--get-bg);color:var(--get)}.qi.tr{background:color-mix(in srgb,#3D7BE0 16%,transparent);color:#3D7BE0}
/* account cards */
.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acc{position:relative;overflow:hidden;text-align:left;border:0;border-radius:18px;padding:12px 13px 11px;display:grid;gap:2px;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--tone) 92%,#fff) 0%,var(--tone) 45%,color-mix(in srgb,var(--tone) 60%,#000) 100%);
  box-shadow:0 10px 22px -14px color-mix(in srgb,var(--tone) 90%,#000);transition:transform .1s}
.acc:active{transform:scale(.97)}
.acc::after{pointer-events:none;content:"";position:absolute;right:-30px;top:-34px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.acc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.acc-dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.22);font-family:var(--display);font-weight:700;font-size:13px}
.acc-kind{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;background:rgba(0,0,0,.18);border-radius:99px;padding:2px 8px}
.acc-name{font-size:13px;font-weight:600;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-bal{font-family:var(--display);font-size:21px;letter-spacing:-.01em;line-height:1.15}
.acc-upd{font-size:11px;opacity:.75}
.tr-ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,#3D7BE0 14%,transparent);color:#3D7BE0}
.tr-ic.in{background:var(--get-bg);color:var(--get)}
.btn.icon{width:30px;height:30px;padding:0;border-radius:9px}
.swap{display:flex;justify-content:center;margin:-4px 0}
.chip-bal{font-weight:500;opacity:.7;font-size:11.5px;margin-left:2px}
.chips input:checked+span .chip-bal{opacity:.9}
/* clear "receive" actions vs. "paid" status */
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.row .side .amt{font-family:var(--display);font-size:16px}
.act{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:99px;padding:6px 12px 6px 9px;font-size:12.5px;font-weight:700;white-space:nowrap;flex:none;transition:transform .08s,filter .15s}
.act:active{transform:scale(.95)}
.act.in{background:var(--get-bg);color:var(--get);border-color:color-mix(in srgb,var(--get) 30%,transparent)}
.act.in.hot{background:var(--get);color:#fff;border-color:var(--get);box-shadow:0 4px 12px -6px var(--get)}
.act.out{background:var(--owe-bg);color:var(--owe);border-color:color-mix(in srgb,var(--owe) 30%,transparent)}
.act.ghost{background:none;color:var(--muted);border:1px dashed var(--line);padding:5px 11px;font-weight:600}
.done{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--get);white-space:nowrap}
.done svg{width:15px;height:15px;stroke-width:2.6}
.pills{margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nextdue{font-size:12px;color:var(--muted)}
.pill.ok,.pill.bad,.pill.soon{display:inline-flex;align-items:center;gap:5px}
.pill.bad::before,.pill.soon::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
/* general polish */
#view>section{animation:fadein .25s ease-out both}
@media (prefers-reduced-motion:reduce){#view>section{animation:none}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.list .row{transition:background .12s}
.row .main .t{letter-spacing:-.005em}
.sheet h2{font-size:21px}
.sheet .btns .btn{padding:10px 14px}
.f input:focus,.f select:focus,.f textarea:focus,input.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input.search{border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-color:transparent}
.seg{border-radius:14px;padding:4px}.seg button{border-radius:11px;padding:9px 6px}
nav.tabs button{transition:color .15s}
.hero .big{font-size:40px}
.toast{border-radius:14px;padding:11px 16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);font-weight:600}

/* ===== v7: eye-catching pass ===== */
:root{--grad:linear-gradient(135deg,#12A27E,#0A5546 60%,#083A30)}
body{background:
  radial-gradient(900px 420px at 110% -10%,color-mix(in srgb,#3D7BE0 14%,transparent),transparent 60%),
  radial-gradient(900px 420px at -20% -5%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.sec-h h2{display:flex;align-items:center;gap:9px}
.sec-h h2::before{content:"";width:5px;height:18px;border-radius:9px;background:linear-gradient(180deg,#19C39A,#0A5546);flex:none}
.card,.list{border:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
/* hero */
.hero{background:radial-gradient(500px 220px at 100% 0%,rgba(80,230,190,.35),transparent 60%),linear-gradient(140deg,#13936F 0%,#0A5546 55%,#062E26 100%);padding:20px 18px 14px}
.hero .big{text-shadow:0 2px 18px rgba(0,0,0,.25)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
/* stat tiles */
.stat.tint{position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--dot) 16%,var(--surface)) 0%,var(--surface) 75%);border-color:color-mix(in srgb,var(--dot) 22%,transparent)}
.stat.tint::after{pointer-events:none;content:"";position:absolute;right:-18px;bottom:-18px;width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--dot) 14%,transparent)}
.stat.tint b{font-size:19px}
/* summary chips (reminders) */
.summary .chipbox{position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--dot,var(--muted)) 18%,var(--surface)),var(--surface) 80%);border:1px solid color-mix(in srgb,var(--dot,var(--line)) 25%,transparent)}
.summary .chipbox span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot);margin-right:6px;vertical-align:1px}
/* date badge */
.dbadge{flex:none;width:44px;height:46px;border-radius:13px;display:grid;place-items:center;align-content:center;line-height:1;gap:3px;background:var(--get-bg);color:var(--get)}
.dbadge b{font-family:var(--display);font-size:18px}.dbadge i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.85}
.dbadge.out{background:var(--warn-bg);color:var(--warn)}.dbadge.over{background:var(--owe);color:#fff}
/* chart */
.chart .bars i.in{background:linear-gradient(180deg,#2BD3A1,var(--get))}
.chart .bars i.out{background:linear-gradient(180deg,#FF9C86,var(--owe))}
.chart .col.now{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:12px;padding:4px 0}
.bar{height:7px}.bar i{background:linear-gradient(90deg,#2BD3A1,var(--get));border-radius:9px}
/* people banner */
.pbanner{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(140deg,#13936F,#0A5546 60%,#062E26);box-shadow:0 14px 30px -16px rgba(10,85,70,.8)}
.pbanner.owe{background:linear-gradient(140deg,#E2674F,#A8331F 60%,#6E1D10);box-shadow:0 14px 30px -16px rgba(168,51,31,.8)}
.pbanner::after{pointer-events:none;content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}
.pbanner b{display:block;font-family:var(--display);font-size:32px;line-height:1.1;margin:2px 0}
.pb-l{font-size:12.5px;opacity:.85;font-weight:600}.pb-s{font-size:12.5px;opacity:.85}
.pb-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.18);position:relative;z-index:1}
.pb-ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg button[data-side="get"].on{background:var(--get);color:#fff}.seg button[data-side="owe"].on{background:var(--owe);color:#fff}
.grp h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
/* avatars */
.av{background:linear-gradient(140deg,hsl(var(--h) 80% 88%),hsl(calc(var(--h) + 40) 70% 80%));color:hsl(var(--h) 55% 24%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:linear-gradient(140deg,hsl(var(--h) 35% 26%),hsl(calc(var(--h) + 40) 35% 20%))}}
:root[data-theme="dark"] .av{background:linear-gradient(140deg,hsl(var(--h) 35% 26%),hsl(calc(var(--h) + 40) 35% 20%))}
/* house + car banner cards */
.hcard{padding-top:0;overflow:hidden}
.hcard>.house-h{margin:0 -14px 14px;padding:18px 14px 16px;color:#fff;align-items:center;position:relative;overflow:hidden;
  background:radial-gradient(260px 140px at 100% 0%,rgba(255,255,255,.22),transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--tone) 85%,#fff),var(--tone) 45%,color-mix(in srgb,var(--tone) 55%,#000))}
.hcard>.house-h h3{color:#fff;font-size:20px}
.hcard>.house-h .s{color:rgba(255,255,255,.85)}
.hcard>.house-h .hicon{background:rgba(255,255,255,.2);color:#fff;width:44px;height:44px;border-radius:14px}
.hcard>.house-h .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.hcard .kpi{background:linear-gradient(160deg,color-mix(in srgb,var(--tone) 12%,var(--surface)),var(--sunk))}
.hcard .landlord{background:linear-gradient(135deg,color-mix(in srgb,var(--tone) 10%,var(--sunk)),var(--sunk));border:1px solid color-mix(in srgb,var(--tone) 18%,transparent)}
.hcard .btn.pri{background:var(--tone);border-color:var(--tone);color:#fff;box-shadow:0 6px 14px -8px var(--tone)}
.plate{display:inline-block;background:#fff;color:#0B2545;border:2px solid #0B2545;border-radius:7px;padding:1px 10px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:800;letter-spacing:.12em;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
/* reminders */
.card.rem{border-left:5px solid var(--muted)}.card.rem.over{border-left-color:var(--owe)}.card.rem.soon{border-left-color:var(--warn)}.card.rem.debt{border-left-color:var(--get)}
.remamt{font-family:var(--display);font-size:18px;white-space:nowrap}
.msg{background:linear-gradient(160deg,var(--sunk),color-mix(in srgb,var(--sunk) 60%,var(--surface)));border:1px solid var(--line)}
/* floating tab bar */
nav.tabs{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border-radius:24px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);max-width:620px;margin:0 auto;box-shadow:0 14px 36px -14px rgba(0,0,0,.45)}
nav.tabs button{padding:8px 2px 9px}
nav.tabs button.on svg{background:var(--grad);color:#fff;stroke:#fff;box-shadow:0 6px 14px -6px rgba(10,85,70,.9)}
body{padding-bottom:110px}
.toast{bottom:100px}
/* buttons */
.btn.pri{background:var(--grad);border-color:transparent}
.qa .qi{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.qa:nth-child(3) .qi{background:color-mix(in srgb,#C2410C 14%,transparent);color:#C2410C}
.qa:nth-child(4) .qi{background:color-mix(in srgb,#7A4FD0 14%,transparent);color:#7A4FD0}
.cal button.today{background:var(--grad);color:#fff;outline:none}
.cal button.today .dots i{box-shadow:0 0 0 1.5px #fff}
.chiprow button.on{background:var(--grad);border-color:transparent;color:#fff}
.lock{background:radial-gradient(600px 300px at 50% 0%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 70%),var(--bg)}
.pad button{box-shadow:var(--shadow)}
.plate.sm{font-size:13px;padding:0 7px;border-width:1.5px;border-radius:5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.card.ptint{position:relative;overflow:hidden;background:radial-gradient(320px 160px at 100% 0%,color-mix(in srgb,var(--get) 18%,transparent),transparent 70%),var(--surface)}
.card.ptint .label+div{font-weight:700}

/* ===== v8: header fix + more life ===== */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
header.top .hbrand{display:flex;align-items:center;gap:11px;min-width:0}
header.top .logo{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#19C39A,#0A5546 60%,#062E26);box-shadow:0 8px 18px -8px rgba(10,85,70,.9),inset 0 1px 0 rgba(255,255,255,.3)}
header.top .logo svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header.top .hl-t{min-width:0}
header.top .when{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
header.top .when b{color:var(--accent);font-family:var(--display);font-size:12.5px;letter-spacing:0}
header.top .when b::after{content:"·";color:var(--muted);margin-left:6px}
header.top h1{font-size:25px;line-height:1.1}
header.top .eye{flex:none;width:40px;height:40px;border-radius:13px;box-shadow:var(--shadow)}
/* hero alive */
.hero{background:linear-gradient(120deg,#16A57E,#0A5546,#0C3D5C,#0A5546,#16A57E);background-size:300% 300%;animation:heroflow 14s ease infinite;padding:16px 18px 16px}
@keyframes heroflow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);animation:shine 6s ease-in-out infinite 1.2s;pointer-events:none;width:auto;height:auto;left:0;bottom:0;border-radius:0}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.hero,.hero::before{animation:none}}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;position:relative;z-index:1}
.greet{font-size:13.5px;font-weight:600;opacity:.95}
.chg{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.chg.up{color:#B9FFE3}.chg.down{color:#FFD0C6}
.hero .big{font-size:42px;position:relative;z-index:1}
.alloc{display:flex;gap:3px;height:9px;border-radius:9px;overflow:hidden;margin-top:12px;position:relative;z-index:1;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.alloc i{display:block;min-width:4px;filter:saturate(1.2) brightness(1.15)}
.alloc-l{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;font-weight:600;opacity:.92;position:relative;z-index:1}
.alloc-l i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0;filter:brightness(1.25);box-shadow:0 0 0 1px rgba(255,255,255,.4)}
/* staggered entrance for lists */
@media (prefers-reduced-motion:no-preference){
 .list>.row,.accgrid>.acc,.quick>.qa,.stats>.stat{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
 .list>.row:nth-child(2),.accgrid>.acc:nth-child(2),.quick>.qa:nth-child(2),.stats>.stat:nth-child(2){animation-delay:.04s}
 .list>.row:nth-child(3),.accgrid>.acc:nth-child(3),.quick>.qa:nth-child(3),.stats>.stat:nth-child(3){animation-delay:.08s}
 .list>.row:nth-child(4),.accgrid>.acc:nth-child(4),.quick>.qa:nth-child(4){animation-delay:.12s}
 .list>.row:nth-child(5),.accgrid>.acc:nth-child(5){animation-delay:.16s}
 .list>.row:nth-child(n+6),.accgrid>.acc:nth-child(6){animation-delay:.2s}
 nav.tabs button.on svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
/* glassy cards & depth */
.card,.list{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 96%,#fff),var(--surface))}
.acc:hover,.qa:hover{transform:translateY(-2px)}
.acc,.qa{transition:transform .15s,box-shadow .15s}
.acc::before{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.pbanner{background-size:200% 200%;animation:heroflow 16s ease infinite}
.pbanner.get{background-image:linear-gradient(120deg,#16A57E,#0A5546,#0C3D5C,#16A57E)}
.pbanner.owe{background-image:linear-gradient(120deg,#E2674F,#A8331F,#6E1D3A,#E2674F)}
.hcard>.house-h>*{position:relative;z-index:1}
.hcard>.house-h::after{pointer-events:none;z-index:0;content:"";position:absolute;right:-30px;bottom:-50px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(255,255,255,.08)}
.act.in.hot{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--get) 50%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.sheet{box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
@media (max-width:360px){.stat .label{font-size:9px;letter-spacing:.02em}.stat .label::before{margin-right:4px}.stat.tint b{font-size:17px}.qa{font-size:11.5px}}
.sheet h2{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--accent) 70%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== v9: month chart ===== */
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.in{background:linear-gradient(180deg,#2BD3A1,var(--get))}.lg.out{background:linear-gradient(180deg,#FF9C86,var(--owe))}
.lg.dash{background:none;border:1.5px dashed var(--muted)}
.mc{padding:16px 14px 12px}
.mc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.mc-pr{font-family:var(--display);font-size:30px;line-height:1.1;margin-top:2px;letter-spacing:-.02em}
.mc-pr small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0}
.mc-io{display:grid;gap:4px;font-size:13px}
.mc-io div{display:flex;align-items:center;gap:2px}.mc-io span{color:var(--muted);font-weight:600;width:30px}.mc-io b{font-family:var(--display);font-size:15px;margin-left:auto;padding-left:8px}
.mc-prog{margin-top:10px}.mc-prog span{font-size:12px;color:var(--muted);font-weight:600}
.mc-plot{position:relative;height:160px;margin:18px 0 0 34px}
.mc-grid{position:absolute;inset:0;pointer-events:none}
.mc-grid div{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--line) 85%,transparent)}
.mc-grid div:last-child{border-top:1.5px solid var(--line)}
.mc-grid span{position:absolute;left:-36px;top:-8px;width:30px;text-align:right;font-size:10.5px;color:var(--muted);font-weight:600}
.mc-cols{position:absolute;inset:0;display:flex;gap:6px}
.mc-col{flex:1;border:0;background:none;padding:0;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;transition:background .2s}
.mc-col.on{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 12%,transparent))}

const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const toN=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const fromN=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const addDays=(s,k)=>fromN(toN(s)+k);
const fmtD=s=>new Date(toN(s)*864e5).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});

function monthDates(day,from,to){const out=[];let [y,m]=from.split('-').map(Number);const [ty,tm]=to.split('-').map(Number);

  const f=el.querySelector('form');if(f)f.addEventListener('submit',ev=>{ev.preventDefault();onSubmit&&onSubmit(Object.fromEntries(new FormData(f)),f)});

function paySheet(id){
  const e=getEntry(id),get=e.side==='get';

    if(plan.extra>0){toast(`That is ${money(plan.extra)} more than ${first(e.name)} owes. Check the amount.`);return}
    const parts=[...plan.rent.map(x=>`${x.h.kind==='car'?'car rent':'rent'} ${num(x.amt)}`),plan.loan&&plan.rent.length?`loan ${num(plan.loan)}`:''].filter(Boolean);

function methodSheet(p,sign,name,list){
  const old=p.via,T=p.amt;
  sheet(`<h2>Change payment</h2><div class="sub">${money(T)} · ${esc(name)}. ${old?'Changing the method moves the money between your accounts.':'Old payment: this only sets the label. Balances stay the same.'}</div>
  <form class="f"><div class="fld" style="font-size:14px;color:var(--ink)">${sign>0?'How did they pay you?':'Paid from'}${viaChips('via',old||(liquid()[0]||{}).id)}</div>
  ${list?`<div class="fld" style="font-size:14px;color:var(--ink)">Paid two ways? Part paid another way (optional)<input name="amt2" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 480" style="margin-top:4px">${viaChips('via2','cash')}</div>`:''}
  ${dateF(p.iso)}${actions('Save')}</form>`,
  d=>{const a2=list?(+d.amt2||0):0;
    if(a2&&a2>=T){toast('The second part must be less than '+money(T));return}
    const a1=T-a2;
    commit(a2?`${name}: ${num(T)} split into ${num(a1)} ${accName(d.via)} + ${num(a2)} ${accName(d.via2)}`:`${name}: ${num(T)} payment set to ${accName(d.via)}`,()=>{
      if(old){adjust(old,-sign*T);adjust(d.via,sign*a1);if(a2)adjust(d.via2,sign*a2)}
      p.via=d.via;p.iso=d.iso;
      if(a2){p.amt=a1;list.splice(list.indexOf(p)+1,0,{amt:a2,iso:d.iso,via:d.via2})}})});
}

/* ---------- bills & cars ---------- */
function addMonths(s,n){let[y,m,d]=s.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}-${pad(Math.min(d,daysIn(y,m)))}`}
const daysTo=s=>toN(s)-toN(todayISO());
const monthRange=ym=>{const[y,m]=ym.split('-').map(Number);return [ym+'-01',`${ym}-${pad(daysIn(y,m))}`]};
const monthLabel=ym=>new Date(toN(ym+'-01')*864e5).toLocaleDateString('en-AU',{month:'long',year:'numeric',timeZone:'UTC'});
function chipsOf(name,opts,sel){return `<div class="chips">${opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o)}" ${o===sel?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`}
const BILL_TYPES=['Electricity','Gas','Water','Internet','Council','Other'];
const CAR_TYPES=['Rego','Service','Repair','Tyres','Insurance','Fuel','Other'];

}

function carStatus(c){
  const rd=daysTo(c.regoExpiry);
  const rego={days:rd,cls:rd<0?'bad':rd<=21?'soon':'ok',txt:rd<0?`Rego expired ${fmtDs(c.regoExpiry)}`:rd===0?'Rego expires today':`Rego to ${fmtDs(c.regoExpiry)} · ${rd} days left`};
  let svc;
  if(c.odo==null||c.lastServiceKm==null)svc={cls:'n',txt:'Add km to track service',left:null};
  else{const next=c.lastServiceKm+c.serviceEvery,left=next-c.odo;svc={cls:left<=0?'bad':left<=1000?'soon':'ok',txt:left<=0?`Service overdue by ${num(-left)} km`:`Next service at ${num(next)} km · ${num(left)} km left`,left,next}}
  let ins=null;if(c.insExpiry){const d=daysTo(c.insExpiry);ins={days:d,cls:d<0?'bad':d<=21?'soon':'ok',txt:d<0?`Insurance expired ${fmtDs(c.insExpiry)}`:`Insurance to ${fmtDs(c.insExpiry)} · ${d} days left`}}
  return {rego,svc,ins};
}
function carAlerts(){const out=[];S.cars.forEach(c=>{const s=carStatus(c);
  if(s.rego.days<=30)out.push({c,txt:s.rego.txt,cls:s.rego.cls});
  if(s.svc.left!=null&&s.svc.left<=1000)out.push({c,txt:s.svc.txt,cls:s.svc.cls});
  if(s.ins&&s.ins.days<=30)out.push({c,txt:s.ins.txt,cls:s.ins.cls})});return out}
const carUse=c=>c.use==='rented'?`Rented to ${c.renter||'someone'}`:'Personal';

function vCars(){
  const [from,to]=monthRange(month);
  const inM=S.carCosts.filter(x=>x.iso>=from&&x.iso<=to);
  const rentedCost=inM.filter(x=>carOf(x).use==='rented').reduce((s,x)=>s+x.amt,0);

  const income=month<S.trackStart?0:S.houses.filter(h=>h.kind==='car').reduce((s,h)=>s+h.tenants.reduce((a,t)=>a+tenantDues(t,from,to).reduce((b,d)=>b+d.amt,0),0),0);
  const al=carAlerts();
  return `${vCarRent()}<section><div class="card"><div class="monthnav"><button class="btn sm" data-act="mprev" aria-label="Previous month">‹</button><b>${monthLabel(month)}</b><button class="btn sm" data-act="mnext" aria-label="Next month">›</button></div>

  <div class="mut" style="font-size:12.5px;margin-top:8px">Your personal car costs this month: <b style="color:var(--ink)">${money(personal)}</b>. These are not part of rent profit.</div></div></section>
  ${al.length?`<section><div class="list">${al.map(a=>`<div class="row"><div class="main"><div class="t"><span class="plate sm">${esc(a.c.plate)}</span></div><div class="s">${esc(carUse(a.c))}</div></div><span class="pill ${a.cls}">${esc(a.txt)}</span></div>`).join('')}</div></section>`:''}
  ${S.cars.map(vCar).join('')}
  <section><button class="btn wide" data-act="addCar">Add car</button></section>`;
}

  <div class="landlord"><div><span class="label">Rego · every ${c.regoMonths} months</span><div style="margin-top:3px"><span class="pill ${s.rego.cls}">${s.rego.txt}</span></div><div class="gauge ${s.rego.cls}"><i style="width:${Math.max(3,Math.min(100,s.rego.days/(c.regoMonths*30.4)*100))}%"></i></div></div><button class="btn sm pri" data-act="carCost" data-id="${c.id}" data-type="Rego">Pay rego</button></div>

  ${costs.slice(0,5).map(x=>`<div class="row" style="padding-inline:0"><div class="main"><div class="t">${esc(x.type)} ${money(x.amt)}</div><div class="s">${fmtD(x.iso)} · ${esc(accName(x.via))}${x.km!=null?' · '+num(x.km)+' km':''}${x.note?' · '+esc(x.note):''}</div></div><button class="btn sm dan" data-act="delCarCost" data-id="${x.id}">Remove</button></div>`).join('')||'<div class="empty" style="padding:8px 0">No costs yet.</div>'}

      S.carCosts.push({id:uid('cc'),car:c.id,type:d.type,amt,via:d.via,iso:d.iso,km,note:d.note.trim()||undefined,prevRego:d.type==='Rego'?c.regoExpiry:undefined,prevSvc:d.type==='Service'?c.lastServiceKm:undefined});

function flows(from,to){
  const out=[],inR=x=>x.iso>=from&&x.iso<=to;
  S.rentPayments.filter(p=>!p.pre&&inR(p)).forEach(p=>{const h=S.houses.find(x=>x.id===p.h);out.push({cat:h&&h.kind==='car'?'Car rent in':'House rent in',amt:p.amt,via:p.via})});
  S.entries.forEach(e=>e.payments.filter(inR).forEach(p=>out.push({cat:e.side==='get'?'Loans paid back to you':'You paid back loans',amt:e.side==='get'?p.amt:-p.amt,via:p.via})));
  S.moves.filter(inR).forEach(m=>out.push({cat:m.amt<0?'Money you lent':'Money you borrowed',amt:m.amt,via:m.via}));
  S.landlordPaid.filter(p=>!p.pre&&inR(p)).forEach(p=>out.push({cat:'Landlord rent',amt:-p.amt,via:p.via}));
  S.bills.filter(inR).forEach(b=>out.push({cat:'House bills',amt:-b.amt,via:b.via}));
  S.carCosts.filter(inR).forEach(c=>out.push({cat:carOf(c).use==='rented'?'Rented car costs':'Personal car costs',amt:-c.amt,via:c.via}));
  S.expenses.filter(inR).forEach(x=>out.push({cat:x.cat,amt:x.kind==='in'?x.amt:-x.amt,via:x.via,exp:x.kind!=='in'}));
  return out;
}

/* ---------- PIN lock ---------- */
const PINKEY='dhiman-ledger-pin';let pinHash=null,pinBuf='';try{pinHash=localStorage.getItem(PINKEY)}catch(e){}
function hpin(s){let h=2166136261;for(const c of 'dhiman-ledger:'+s+':pin'){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function showLock(){pinBuf='';document.getElementById('view').innerHTML='';document.getElementById('lock').innerHTML=`<div class="lock"><div><h2>Roy's Ledger</h2><div class="mut" style="margin-top:4px">Enter your PIN</div><div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'del'].map(k=>k===''?'<span></span>':`<button type="button" data-pin="${k}" aria-label="${k==='del'?'Delete':k}">${k==='del'?'⌫':k}</button>`).join('')}</div>
  <button type="button" class="btn sm" data-pin="forgot">Forgot PIN</button></div></div>`}
function pinPress(k){
  if(k==='forgot'){document.getElementById('lock').innerHTML=`<div class="lock"><div style="max-width:340px"><h2>Forgot PIN</h2><p class="mut">The only way in is to erase the data on this phone and start again. Then restore your latest backup from Report &amp; more.</p><div class="btns" style="justify-content:center"><button type="button" class="btn" data-pin="back">Go back</button><button type="button" class="btn pri" style="background:var(--owe);border-color:var(--owe)" data-pin="erase">Erase and start again</button></div></div></div>`;return}
  if(k==='back'){showLock();return}
  if(k==='erase'){try{localStorage.removeItem(PINKEY);localStorage.removeItem(KEY)}catch(e){}pinHash=null;S=migrate(JSON.parse(JSON.stringify(SEED)));save();document.getElementById('lock').innerHTML='';tab='more';render();toast('Erased. Restore your backup below.');return}
  pinBuf=k==='del'?pinBuf.slice(0,-1):(pinBuf+k).slice(0,4);
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
  if(pinBuf.length===4){if(hpin(pinBuf)===pinHash){document.getElementById('lock').innerHTML='';render()}else{const d=document.getElementById('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');pinBuf='';setTimeout(()=>document.querySelectorAll('#dots i').forEach(i=>i.classList.remove('on')),300)}}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-pin]');if(b)pinPress(b.dataset.pin)});
function pinSheet(){
  sheet(`<h2>Set a PIN</h2><div class="sub">4 numbers. Write it down. If you forget it, you need your backup to get back in.</div>
  <form class="f"><div class="two"><label>New PIN<input name="p1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label><label>Type it again<input name="p2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label></div>${actions('Turn on PIN')}</form>`,
  d=>{if(!/^\d{4}$/.test(d.p1)){toast('Use 4 numbers');return}if(d.p1!==d.p2){toast('The two PINs do not match');return}
    pinHash=hpin(d.p1);try{localStorage.setItem(PINKEY,pinHash)}catch(e){}closeSheet();render();toast('PIN is on')});
}
function vPin(){return `<section><div class="sec-h"><h2>PIN lock</h2></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
  <span>${pinHash?'PIN is <b class="pos">on</b>. The app asks for it when it opens.':'<span class="mut">No PIN. Anyone with your phone can open this.</span>'}</span>
  <div class="btns">${pinHash?'<button class="btn sm" data-act="lockNow">Lock now</button><button class="btn sm dan" data-act="pinOff">Turn off</button>':'<button class="btn sm pri" data-act="pinOn">Set PIN</button>'}</div></div></div></section>`}

/* if the built-in data is newer than what this browser saved, use the newer one (old one kept as a safety copy) */
(function(){try{const lastOf=d=>(d&&d.log&&d.log[0]&&d.log[0].iso)||'';const seedLast=lastOf(SEED),mine=lastOf(S);
  if(seedLast&&seedLast>mine){snapNow('Older data before update');S=migrate(JSON.parse(JSON.stringify(SEED)));S.undo=null;
    setTimeout(()=>toast('Loaded your latest data ('+fmtWhen(seedLast)+')'),400)}}catch(e){}})();
(function(){try{if(!matchMedia('(pointer:fine)').matches||matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){return}
  let cur=null;document.addEventListener('pointermove',ev=>{const c=ev.target.closest&&ev.target.closest('.pcard,.acc');
    if(cur&&cur!==c){cur.style.transform='';cur.style.removeProperty('--mx');cur=null}if(!c)return;cur=c;
    const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
    c.style.transform=`perspective(900px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translateY(-3px)`;c.style.setProperty('--mx',((x+.5)*100).toFixed(1)+'%')})})();
save();if(pinHash)showLock();else render();
</script>
