}

document.addEventListener('touchmove',e=>{if(!sDrag)return;sDrag.dy=Math.max(0,e.touches[0].clientY-sDrag.y0);sDrag.sh.style.transition='none';sDrag.sh.style.transform=`translateY(${sDrag.dy}px)`},{passive:true});
document.addEventListener('touchend',()=>{if(!sDrag)return;const d=sDrag;sDrag=null;if(d.dy>110){closeSheet();return}d.sh.style.transition='transform .35s cubic-bezier(.2,1.3,.3,1)';d.sh.style.transform=''});
function viaChips(name='via',sel){const opts=[...liquid().map(a=>[a.id,a.name]),['','Not tracked']];sel=sel??(liquid().some(a=>a.id===S.lastVia)?S.lastVia:(liquid()[0]||{}).id);
  return `<div class="chips" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${esc(v)}" ${v===sel?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div>`}
/* ---------- split payments: one amount paid from / into two or more accounts ---------- */
function viaPick(name='via',sel){const L=liquid();
  return `<div class="vp">${viaChips(name,sel)}${L.length>1?`<label class="sp-tg"><input type="checkbox" name="split" value="1"><span>${ic('swap')} Split between accounts (e.g. cash + bank)</span></label>
  <div class="spbox" hidden>${L.map(a=>`<div class="sp-row"><span class="sp-n"><i style="background:${accTone(a)}"></i>${esc(a.name)}</span><input name="sp_${esc(a.id)}" data-acc="${esc(a.id)}" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0"><button type="button" class="btn sm" data-act="spRest">Rest</button></div>`).join('')}<div class="sp-sum"></div></div>`:''}</div>`}
const n2=n=>Math.abs(n-Math.round(n))<0.005?num(n):(Math.round(n*100)/100).toFixed(2);
const sumP=ps=>Math.round(ps.reduce((s,p)=>s+p.amt,0)*100)/100;
const PO=x=>x&&x.parts&&x.parts.length?x.parts:[{via:x?x.via:'',amt:x?x.amt:0}];
const viaLbl=x=>{const ps=PO(x);return ps.length>1?ps.map(p=>accName(p.via)+' '+n2(p.amt)).join(' + '):accName(ps[0].via)};
const pL=ps=>ps.length>1?' · '+ps.map(p=>accName(p.via)+' '+n2(p.amt)).join(' + '):(ps[0]&&ps[0].via?' · '+accName(ps[0].via):'');
function readParts(d,total){total=Math.round((+total||0)*100)/100;
  if(!d.split){if(!total){toast('Enter an amount');return null}return [{via:d.via||'',amt:total}]}
  const ps=liquid().map(a=>({via:a.id,amt:Math.round((+d['sp_'+a.id]||0)*100)/100})).filter(p=>p.amt>0);
  if(!ps.length){toast('Enter how much went to each account');return null}
  const s=sumP(ps);if(total&&Math.abs(s-total)>0.009){toast(`The split adds up to $${n2(s)}, but the amount is $${n2(total)}. Fix one of them.`);return null}
  return ps}
function allocate(items,ps){const left=ps.map(p=>({...p})),out=[];
  items.forEach(it=>{let need=Math.round(it.amt*100)/100;for(const p of left){if(need<=0.004)break;if(p.amt<=0.004)continue;const a=Math.round(Math.min(need,p.amt)*100)/100;out.push({it,via:p.via,amt:a});p.amt=Math.round((p.amt-a)*100)/100;need=Math.round((need-a)*100)/100}});
  return out}
function spUpdate(f){if(!f)return;const box=f.querySelector('.spbox');if(!box||box.hidden)return;const tot=+(f.querySelector('[name=amt]')||{}).value||0;
  const s=[...box.querySelectorAll('input[data-acc]')].reduce((a,i)=>a+(+i.value||0),0),left=Math.round((tot-s)*100)/100;
  box.querySelectorAll('input[data-acc]').forEach(i=>i.placeholder=!i.value&&left>0?n2(left):'0');
  const el=box.querySelector('.sp-sum');el.className='sp-sum '+(Math.abs(left)<0.01?'ok':left>0?'n':'bad');
  el.textContent=!tot?`Total of parts: $${n2(s)}`:Math.abs(left)<0.01?`✓ Adds up to $${n2(tot)}`:left>0?`$${n2(left)} still to split`:`$${n2(-left)} too much`}
document.addEventListener('change',ev=>{const t=ev.target;if(t.name!=='split'||!t.closest('.vp'))return;const vp=t.closest('.vp'),box=vp.querySelector('.spbox'),ch=vp.querySelector('.chips');
  box.hidden=!t.checked;ch.hidden=t.checked;const off=vp.parentElement&&vp.parentElement.querySelector('.offchips');if(off)off.hidden=t.checked;
  if(t.checked){const f=t.closest('form'),sel=ch.querySelector('input:checked'),tot=+(f.querySelector('[name=amt]')||{}).value||0;const ins=[...box.querySelectorAll('input[data-acc]')];
    if(!ins.some(i=>i.value)&&sel&&sel.value&&tot){const i=ins.find(x=>x.dataset.acc===sel.value);if(i)i.value=tot}spUpdate(f)}});

const amtF=(v,label='Amount')=>`<label>${label}<input name="amt" type="number" inputmode="decimal" step="0.01" min="0" value="${v??''}" required></label>`;
const dateF=(v=todayISO(),label='Date',name='iso')=>`<label>${label}<input name="${name}" type="date" value="${v}" required></label>`;

function timelineHTML(e){const k=nk(e.name),ev=[];
  if(!e.virtual){e.payments.forEach(p=>ev.push({iso:p.iso,t:`${e.side==='get'?'Paid you':'You paid'} ${money(p.amt)}${p.via?' · '+accName(p.via):''}`,c:'var(--get)'}));
    S.moves.filter(m=>nk(m.who)===k).forEach(m=>ev.push({iso:m.iso,t:m.amt<0?`You lent ${money(-m.amt)}`:`You borrowed ${money(m.amt)}`,c:m.amt<0?'var(--owe)':'var(--warn)'}));
    if(e.added)ev.push({iso:e.added,t:'Added to the ledger'+(e.note?' · '+e.note:''),c:'var(--muted)'})}
  S.houses.forEach(h=>h.tenants.filter(t=>nk(t.name)===k).forEach(t=>{S.rentPayments.filter(p=>p.t===t.id&&!p.pre).forEach(p=>ev.push({iso:p.iso,t:`${h.kind==='car'?'Car rent':'Rent'} ${money(p.amt)} · ${h.name}${p.via?' · '+accName(p.via):''}`,c:'var(--get)'}));
    tenantStatus(t).over.forEach(x=>ev.push({iso:x.date,t:`Missed ${h.kind==='car'?'car rent':'rent'} ${money(x.left)} · ${h.name}`,c:'var(--owe)'}))}));
  S.msgs.filter(m=>nk(m.who)===k).forEach(m=>ev.push({iso:m.iso,t:`Message sent by ${m.how}`,x:m.text,c:'var(--accent)'}));

function logMsg(name,how,text){S.msgs.unshift({who:name,how,text,iso:new Date().toISOString()});S.msgs=S.msgs.slice(0,300);save()}
function personSheet(id){
  const e=getEntry(id);const r=remOf(e),get=e.side==='get';const ro=get?rentOwed(e.name):[],roA=sumLeft(ro),tot=get?totalOf(e):Math.max(0,r);

  ${ro.length?`<span class="label">Rent not paid · added to total</span><div class="list" style="margin:6px 0 14px">${ro.map(x=>`<div class="row"><div class="main"><div class="t">${hlRent(x)}</div><div class="s">${esc(x.h.name)}</div></div><button class="act in" data-act="rentIn" data-h="${x.h.id}" data-id="${x.t.id}">${QI.in}Receive</button></div>`).join('')}</div>`:''}
  ${e.virtual?'':`<div class="seg" style="margin-bottom:12px"><button type="button" data-act="ptab" data-v="pay" data-id="${e.id}" class="${pTab==='pay'?'on':''}">Payments</button><button type="button" data-act="ptab" data-v="hist" data-id="${e.id}" class="${pTab==='hist'?'on':''}">History</button></div>`}

function paySheet(id){
  const e=getEntry(id),get=e.side==='get';
  const roA=get?sumLeft(rentOwed(e.name)):0,loan=Math.max(0,remOf(e)),total=get?loan+roA:remOf(e);
  sheet(`<h2>${get?esc(first(e.name))+' paid you':'You paid '+esc(first(e.name))}</h2><div class="sub">Still ${get?'owed':'to pay'}: ${money(total)}${roA&&loan?` (rent ${money(roA)} + loan ${money(loan)})`:''}</div>
  <form class="f">${amtF(Math.max(0,total))}
  ${roA&&loan?`<div class="fld">Put this toward<div class="chips"><label><input type="radio" name="mode" value="rent" checked><span>Rent first, then loan</span></label><label><input type="radio" name="mode" value="loan"><span>Loan only</span></label></div></div>`:''}
  <div class="fld" style="font-size:14px;color:var(--ink)">${get?'How did they pay you? Bank, cash, or split':'Paid from'}${viaPick()}</div>${dateF()}${actions('Save payment')}</form>`,
  d=>{const ps=readParts(d,d.amt);if(!ps)return;const amt=sumP(ps);
    if(!get){if(amt>Math.max(0,remOf(e))+0.009){toast(`That is more than you owe ${first(e.name)} (${money(Math.max(0,remOf(e)))}). Check the amount.`);return}
      commit(`Paid ${e.name} ${n2(amt)}${pL(ps)}`,()=>{ps.forEach(p=>{e.payments.push({amt:p.amt,iso:d.iso,via:p.via});adjust(p.via,-p.amt)})});
      const left=Math.max(0,remOf(e)),st=sentText(ps.length>1?ps:ps[0].via);receiptSheet(e.name,`Hi ${first(e.name)}, I have sent you $${n2(amt)}${st?' '+st:''} on ${fmtD(d.iso)}. ${left>0?`I still owe you $${num(left)}.`:'That clears what I owe you.'} Thank you!`,'Tell '+esc(first(e.name))+' you paid');return}
    const wasLoan=!e.virtual&&remOf(e)>0;
    const plan=planGet(e,amt,roA?(d.mode||'rent'):'loan');
    if(plan.extra>0){toast(`That is ${money(plan.extra)} more than ${first(e.name)} owes. Check the amount.`);return}
    const parts=[...plan.rent.map(x=>`${x.h.kind==='car'?'car rent':'rent'} ${n2(x.amt)}`),plan.loan&&plan.rent.length?`loan ${n2(plan.loan)}`:''].filter(Boolean);
    const items=[...plan.rent.map(x=>({k:'rent',x,amt:x.amt})),...(plan.loan?[{k:'loan',amt:plan.loan}]:[])];
    commit(`${e.name} paid ${n2(amt)}${parts.length?' ('+parts.join(' + ')+')':''}${pL(ps)}`,()=>{
      allocate(items,ps).forEach(a=>{if(a.it.k==='rent')S.rentPayments.push({id:uid('r'),t:a.it.x.t.id,h:a.it.x.h.id,due:a.it.x.date,amt:a.amt,via:a.via,iso:d.iso});else e.payments.push({amt:a.amt,iso:d.iso,via:a.via})});
      ps.forEach(p=>adjust(p.via,p.amt))});
    const what=plan.rent.length?`for your ${[...new Set(plan.rent.map(x=>(x.h.kind==='car'?'car rent ':'rent ')+'due '+fmtDs(x.date)))].join(', ')}${plan.loan?` and $${n2(plan.loan)} off the loan`:''}`:'';
    receiptSheet(e.name,receiptText(e.name,amt,ps.length>1?ps:ps[0].via,d.iso,what));
    if(wasLoan&&remOf(e)<=0){confetti();setTimeout(()=>toast(`${first(e.name)} has paid back everything`),300)}});
}

function findT(hid,tid){const h=S.houses.find(x=>x.id===hid);return {h,t:h.tenants.find(x=>x.id===tid)}}
function rentInSheet(hid,tid){
  const {h,t}=findT(hid,tid);const st=tenantStatus(t);const opts=st.unpaid.slice(0,6);
  if(!opts.length){toast('Nothing unpaid');return}
  const debt=S.entries.find(e=>e.side==='owe'&&e.name.toLowerCase().trim()===t.name.toLowerCase().trim()&&remOf(e)>0);
  sheet(`<h2>${h.kind==='car'?'Car rent':'Rent'} from ${esc(first(t.name))}</h2><div class="sub">${esc(h.name)} · ${money(t.rent)} per ${FREQ[tf(t)].l}</div>
  <form class="f"><label>Which payment<select name="due">${opts.map(o=>`<option value="${o.date}">${fmtD(o.date)}${o.got?` (part paid, ${money(o.left)} left)`:o.date<=todayISO()?' (due)':''}</option>`).join('')}</select></label>
  ${amtF(opts[0].left||t.rent)}<div class="mut" style="font-size:12px;margin-top:-6px">If they pay less than the full rent, the rest stays as owing.</div><div class="fld" style="font-size:14px;color:var(--ink)">How did they pay you? Bank, cash, or split${viaPick()}${debt?`<div class="chips offchips" style="margin-top:6px"><label><input type="radio" name="via" value="offset"><span>Take off what I owe ${esc(first(t.name))} (${money(remOf(debt))})</span></label></div>`:''}</div>${dateF()}${actions('Save rent')}</form>`,
  d=>{const ps=readParts(d,d.amt);if(!ps)return;const amt=sumP(ps),off=!d.split&&d.via==='offset';
    commit(`${t.name} paid rent ${n2(amt)} (${fmtDs(d.due)})${off?' · taken off what you owe':pL(ps)}`,()=>{
    ps.forEach(p=>{const rid=uid('r');S.rentPayments.push({id:rid,t:t.id,h:h.id,due:d.due,amt:p.amt,via:p.via,iso:d.iso});
      if(off&&debt)debt.payments.push({amt:p.amt,iso:d.iso,via:'offset',rid});else adjust(p.via,p.amt)})});
    receiptSheet(t.name,receiptText(t.name,amt,ps.length>1?ps:ps[0].via,d.iso,rentWhat(h,d.due),nextRentLine(t)))});
  const f=document.querySelector('#sheet form');if(f)f.due.addEventListener('change',()=>{const o=opts.find(x=>x.date===f.due.value);if(o){f.amt.value=o.left||t.rent;spUpdate(f)}});
}
function tenantStmt(h,t){const L=[],st=tenantStatus(t),car=h.kind==='car';
  L.push(`Hi ${first(t.name)}, here is your ${car?'car rent':'rent at '+h.address.split(',')[0]} as of ${fmtD(todayISO())}:`);
  L.push(`${car?'Car rent':'Rent'}: $${n2(t.rent)} ${FREQ[tf(t)].n.toLowerCase()}`);
  const pays=S.rentPayments.filter(p=>p.t===t.id&&!p.pre).sort((a,b)=>a.iso<b.iso?1:-1).slice(0,5).reverse();
  if(pays.length)L.push('','Last payments:',...pays.map(p=>`${fmtDs(p.iso)}: $${n2(p.amt)} (for ${fmtDs(p.due)})${p.via&&p.via!=='offset'?' · '+accName(p.via):''}`));
  if(st.over.length)L.push('','Not paid yet:',...st.over.map(x=>`${fmtDs(x.date)}: $${n2(x.left)}`),`Total rent owing: $${n2(st.overAmt)}`);
  else L.push('','You are all paid up. Thank you!');
  if(st.next)L.push(`Next ${car?'car rent':'rent'}: $${n2(st.next.left)} on ${fmtD(st.next.date)}`);
  const all=owedByName(t.name);if(all>st.overAmt+0.009)L.push(`With your loan, you owe me $${num(all)} in total.`);
  L.push('','Thanks!');return L.join('\n')}
function tenantSheet(hid,tid){

  <span class="label">Rent received</span><div class="list" style="margin-top:6px">${pays.map(p=>`<div class="row"><div class="main"><div class="t">${money(p.amt)} · due ${fmtDs(p.due)}</div><div class="s">Paid ${fmtD(p.iso)} · ${p.via?esc(accName(p.via)):'<span class="pill soon">Method not set</span>'}</div></div><button class="btn sm" data-act="rcRent" data-id="${p.id}">Msg</button>${p.via==='offset'?'':`<button class="btn sm" data-act="editRent" data-id="${p.id}">Change</button>`}<button class="btn sm dan" data-act="delRent" data-id="${p.id}">Remove</button></div>`).join('')||'<div class="empty">No rent recorded in the app yet.</div>'}</div>`);
}

function methodSheet(p,sign,name,list){
  const old=p.via,T=p.amt;
  sheet(`<h2>Change payment</h2><div class="sub">${money(T)} on ${fmtD(p.iso)} · ${esc(name)}. ${old?'Your account balances update to match.':'Old payment from before tracking: balances stay the same.'}</div>
  <form class="f">${amtF(T,'Amount')}<div class="fld" style="font-size:14px;color:var(--ink)">${sign>0?'How did they pay you?':'Paid from'}${viaChips('via',old||(liquid()[0]||{}).id)}</div>
  ${list?`<div class="fld" style="font-size:14px;color:var(--ink)">Paid two ways? Amount paid another way (optional)<input name="amt2" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 300" style="margin-top:4px">${viaChips('via2','cash')}<span style="font-weight:500;font-size:12px">This part is taken out of the amount above and saved as a second payment.</span></div>`:''}
  ${dateF(p.iso)}${actions('Save')}</form>`,
  d=>{const A=Math.round((+d.amt||0)*100)/100,a2=list?Math.round((+d.amt2||0)*100)/100:0;
    if(!(A>0)){toast('Enter an amount');return}
    if(a2&&a2>=A){toast('The second part must be less than '+money(A));return}
    if(a2&&d.via2===d.via){toast('Pick a different account for the second part');return}
    const a1=Math.round((A-a2)*100)/100,ch=[];if(A!==T)ch.push(`amount ${n2(T)} → ${n2(A)}`);if(d.via!==old)ch.push(`account → ${accName(d.via)}`);if(d.iso!==p.iso)ch.push(`date → ${fmtDs(d.iso)}`);
    if(!ch.length&&!a2){closeSheet();return}
    commit(a2?`${name}: ${n2(A)} split into ${n2(a1)} ${accName(d.via)} + ${n2(a2)} ${accName(d.via2)}`:`${name}: payment changed (${ch.join(', ')})`,()=>{
      if(old){adjust(old,-sign*T);adjust(d.via,sign*a1);if(a2)adjust(d.via2,sign*a2)}
      p.via=d.via;p.iso=d.iso;p.amt=a1;
      if(a2){const c={...p,amt:a2,iso:d.iso,via:d.via2};delete c.rid;if(p.id)c.id=uid(String(p.id).split('-')[0]||'x');list.splice(list.indexOf(p)+1,0,c)}})});
}

function addMonths(s,n){let[y,m,d]=s.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}-${pad(Math.min(d,daysIn(y,m)))}`}
const daysTo=s=>toN(s)-toN(todayISO());
const monthRange=ym=>{const[y,m]=ym.split('-').map(Number);return [ym+'-01',`${ym}-${pad(daysIn(y,m))}`]};
const monthLabel=ym=>new Date(toN(ym+'-01')*864e5).toLocaleDateString('en-AU',{month:'long',year:'numeric',timeZone:'UTC'});
function chipsOf(name,opts,sel){return `<div class="chips">${opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o)}" ${o===sel?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`}

const CAR_TYPES=['Rego','Service','Repair','Tyres','Insurance','Fuel','Other'];

const bPaid=b=>b.paid!==false,bPayDate=b=>b.paidIso||b.iso;
function payBillSheet(id){const b=S.bills.find(x=>x.id===id);if(!b)return;const h=S.houses.find(x=>x.id===b.h)||{};const sh=b.split?shareDues(b.h,b.iso,b.iso).filter(x=>x.r.id==='b:'+b.id):[],left=sh.filter(x=>!x.got).reduce((a,x)=>a+x.amt,0);
  sheet(`<h2>Pay ${esc(b.type)} bill</h2><div class="sub">${esc(h.name||'')}${b.dueBy?' · due '+fmtD(b.dueBy):''}${left?` · ${m2(left)} still to collect from tenants`:sh.length?' · all shares collected':''}</div>
  <form class="f">${amtF(b.amt)}<div class="fld" style="font-size:14px;color:var(--ink)">Paid from${viaPick()}</div>${dateF(todayISO(),'Date paid')}${actions('Mark paid')}</form>`,
  d=>{const ps=readParts(d,d.amt);if(!ps)return;const amt=sumP(ps);commit(`Paid ${b.type} bill ${n2(amt)} (${h.name||''})${pL(ps)}`,()=>{b.paid=undefined;b.paidIso=d.iso;b.via=ps[0].via;b.parts=ps.length>1?ps:undefined;b.amt=amt;ps.forEach(p=>adjust(p.via,-p.amt))})})}
function billStats(h){const [from,to]=monthRange(month);const now=month===todayISO().slice(0,7);const bs=S.bills.filter(b=>b.h===h.id&&(b.iso>=from&&b.iso<=to||now&&!bPaid(b)&&b.iso<from));const unpaid=bs.filter(b=>!bPaid(b)&&!b.rec);
  const must=S.recurring.filter(r=>r.h===h.id).flatMap(r=>recDates(r,from,to).map(d=>({r,d,paid:!!recPaid(r,d)})));
  const sh=shareDues(h.id,from,to),left=sh.filter(x=>!x.got).reduce((a,x)=>a+x.amt,0);
  return {bs,must,sh,left,unpaid,tot:bs.reduce((a,b)=>a+b.amt,0)+must.filter(m=>!m.paid).reduce((a,m)=>a+m.r.amt,0),due:[...must.filter(m=>!m.paid),...unpaid]}}

function carStatus(c){
  const rd=daysTo(c.regoExpiry);
  const rego={days:rd,cls:rd<0?'bad':rd<=21?'soon':'ok',txt:rd<0?`Rego expired ${fmtDs(c.regoExpiry)}`:rd===0?'Rego expires today':`Rego to ${fmtDs(c.regoExpiry)} · ${rd} days left`};
  let svc;
  if(c.odo==null||c.lastServiceKm==null)svc={cls:'n',txt:'Add km to track service',left:null};
  else{const next=c.lastServiceKm+c.serviceEvery,left=next-c.odo;svc={cls:left<=0?'bad':left<=1000?'soon':'ok',txt:left<=0?`Service overdue by ${num(-left)} km`:`Next service at ${num(next)} km · ${num(left)} km left`,left,next}}
  let ins=null;if(c.insExpiry){const d=daysTo(c.insExpiry);ins={days:d,cls:d<0?'bad':d<=21?'soon':'ok',txt:d<0?`Insurance expired ${fmtDs(c.insExpiry)}`:`Insurance to ${fmtDs(c.insExpiry)} · ${d} days left`}}
  return {rego,svc,ins};
}

  if(s.ins&&s.ins.days<=30)out.push({c,txt:s.ins.txt,cls:s.ins.cls})});return out}

/* ---------- month plan: salary, fixed bills, bill splits, day-to-day ---------- */
const m2=n=>HIDE?'$•••':Math.abs(n-Math.round(n))<0.005?money(n):(n<0?'−$':'$')+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const EVERY={1:'Monthly',3:'Every 3 months',12:'Yearly'};
function recDates(r,from,to){const out=[];for(let k=0;k<400;k++){const d=addMonths(r.anchor,k*(r.every||1));if(d>to)break;if(d>=from)out.push(d)}return out}
const recPaid=(r,d)=>(r.h?S.bills:S.expenses).find(x=>x.rec===r.id&&x.due===d);
const recSplitSum=r=>(r.split||[]).reduce((s,x)=>s+x.amt,0);
function splitSrc(id){if(String(id).startsWith('b:')){const b=S.bills.find(x=>x.id===id.slice(2));if(!b)return null;const h=S.houses.find(x=>x.id===b.h);return {id,name:b.type+(h?' · '+h.name:''),amt:b.amt,split:b.split,h:b.h,bill:b}}return S.recurring.find(x=>x.id===id)}
function shareDues(hid,from,to){const out=[];
  S.bills.filter(b=>b.split&&b.split.length&&(!hid||b.h===hid)&&b.iso>=from&&b.iso<=to).forEach(b=>{const r=splitSrc('b:'+b.id);b.split.forEach(p=>out.push({r,date:b.iso,name:p.name,amt:p.amt,got:S.shareIn.find(x=>x.rec===r.id&&nk(x.name)===nk(p.name))}))});S.recurring.filter(r=>r.split&&r.split.length&&(!hid||r.h===hid)).forEach(r=>recDates(r,from,to).forEach(d=>r.split.forEach(p=>{
  const got=S.shareIn.find(x=>x.rec===r.id&&x.due===d&&nk(x.name)===nk(p.name));out.push({r,date:d,name:p.name,amt:p.amt,got})})));return out}
function payDays(from,to){const j=S.job;if(!j||!j.anchor)return [];return stepDates(j.anchor,from,to,14).filter(d=>d>=(j.start||j.anchor))}
const payGot=d=>S.expenses.find(x=>x.kind==='in'&&x.payDue===d);
function jobAvg(){const j=S.job;const a=[...(j.history||[]).map(x=>x.amt),...S.expenses.filter(x=>x.payDue).sort((p,q)=>p.iso<q.iso?-1:1).map(x=>x.amt)].slice(-6);
  const v=a.length?a.reduce((s,x)=>s+x,0)/a.length:(j.minPay+j.maxPay)/2;return Math.round(Math.min(j.maxPay||v,Math.max(j.minPay||0,v)))}
function planData(ym){
  const [from,to]=monthRange(ym),today=todayISO(),inM=x=>x.iso>=from&&x.iso<=to,isNowM=ym===today.slice(0,7);
  const outs=[];
  S.houses.filter(h=>h.rent>0).forEach(h=>houseDues(h,from,to).forEach(d=>outs.push({k:'land',t:`${h.name} rent`,s:'Landlord'+(!d.paid&&d.got?` · ${m2(d.got)} paid, ${m2(d.left)} left`:''),date:d.date,amt:d.paid&&d.got?d.got:d.amt,paid:d.paid,vl:d.pays.length?[...new Set(d.pays.map(p=>accName(p.via)))].join(' + '):'',act:`data-act="payLandlord" data-id="${h.id}"`})));
  S.recurring.forEach(r=>recDates(r,from,to).forEach(d=>{const p=recPaid(r,d);outs.push({k:'rec',r,t:r.name,s:(r.auto?'Direct debit · ':'')+(r.h?'House bill':EVERY[r.every]||'Bill'),date:d,amt:p?p.amt:r.amt,paid:!!p,via:p?p.via:r.via,vl:p&&p.parts?viaLbl(p):'',auto:r.auto,act:`data-act="recPay" data-id="${r.id}" data-d="${d}"`})}));

  const out=[],inR=x=>x.iso>=from&&x.iso<=to;
  S.rentPayments.filter(p=>!p.pre&&inR(p)).forEach(p=>{const h=S.houses.find(x=>x.id===p.h);out.push({cat:h&&h.kind==='car'?'Car rent in':'House rent in',amt:p.amt,via:p.via})});
  S.entries.forEach(e=>e.payments.filter(inR).forEach(p=>out.push({cat:e.side==='get'?'Loans paid back to you':'You paid back loans',amt:e.side==='get'?p.amt:-p.amt,via:p.via})));
  S.moves.filter(inR).forEach(m=>out.push({cat:m.amt<0?'Money you lent':'Money you borrowed',amt:m.amt,via:m.via}));
  S.landlordPaid.filter(p=>!p.pre&&inR(p)).forEach(p=>out.push({cat:'Landlord rent',amt:-p.amt,via:p.via}));
  S.bills.filter(b=>bPaid(b)&&inR({iso:bPayDate(b)})).forEach(b=>PO(b).forEach(p=>out.push({cat:'House bills',amt:-p.amt,via:p.via})));
  (S.shareIn||[]).filter(inR).forEach(x=>PO(x).forEach(p=>out.push({cat:'Bill shares in',amt:p.amt,via:p.via})));
  S.carCosts.filter(inR).forEach(c=>PO(c).forEach(p=>out.push({cat:carOf(c).use==='rented'?'Rented car costs':'Personal car costs',amt:-p.amt,via:p.via})));
  S.expenses.filter(inR).forEach(x=>PO(x).forEach(p=>out.push({cat:x.cat,amt:x.kind==='in'?p.amt:-p.amt,via:p.via,exp:x.kind!=='in'})));
  return out;
}

  <div class="fld">How often<div class="chips">${Object.entries(PLAN_EVERY).map(([k,v])=>`<label><input type="radio" name="every" value="${k}" ${k===fe?'checked':''}><span>${v[0]}</span></label>`).join('')}</div></div>

    commit(`${e.name}: payment plan ${n2(amt)} ${PLAN_EVERY[d.every][0].toLowerCase()} from ${fmtDs(d.start)}`,()=>{e.plan={amt,every:d.every,start:d.start,base:left}})});
  const f=document.querySelector('#sheet form'),pv=document.getElementById('plprev');
  const upd=()=>{const a=+f.amt.value||0;if(a<=0){pv.textContent='Type an amount to see when it will be paid off.';return}const ev=(f.querySelector('[name=every]:checked')||{}).value||'fortnight',st=f.start.value||todayISO();
    const ds=planDates({every:ev,start:st},st,addMonths(st,120)),k=Math.ceil(left/a),end=ds[Math.min(ds.length-1,k-1)];
    pv.innerHTML=`<b style="color:var(--ink)">${k} payment${k>1?'s':''}</b> of ${money(a)}${left%a&&k>1?` (last one ${money(left-(k-1)*a)})`:''}. Paid off around <b style="color:var(--ink)">${end?fmtD(end):'–'}</b>.`};
  if(f){f.addEventListener('input',upd);f.addEventListener('change',upd);upd()}}
function planDue(from,to){const out=[];S.entries.forEach(e=>{const pi=planInfo(e);if(!pi||pi.done)return;
  if(pi.behind>0)out.push({e,pi,date:pi.lastDue||pi.pl.start,amt:pi.behind,over:true});else if(pi.next&&pi.next>=from&&pi.next<=to)out.push({e,pi,date:pi.next,amt:pi.nextAmt,over:false})});return out}

/* ---------- NEW: collect rent from a whole house at once ---------- */
function collectRows(h){const lim=addDays(todayISO(),7);return h.tenants.map(t=>{const d=tenantStatus(t).unpaid.find(x=>x.date<=lim);return d?{t,d}:null}).filter(Boolean)}
function collectSheet(hid){const h=S.houses.find(x=>x.id===hid);if(!h)return;const rows=collectRows(h);if(!rows.length){toast('No rent due in the next 7 days');return}
  const def=liquid().some(a=>a.id===S.lastVia)?S.lastVia:(liquid()[0]||{}).id,today=todayISO();

  <form class="f"><div class="list">${rows.map((r,i)=>`<div class="crow"><label class="cr-ck"><input type="checkbox" name="c${i}" checked></label><div class="cr-main"><b>${esc(nick(r.t.name))}</b><span class="${r.d.date<=today?'neg':'mut'}">${fmtDs(r.d.date)}${r.d.date<today?' · late':r.d.date===today?' · today':''}${r.d.got?' · part paid':''}</span></div><input class="cr-amt" name="a${i}" type="number" inputmode="decimal" step="0.01" min="0" value="${r.d.left}"><select class="cr-via" name="v${i}">${opts(def)}</select></div>`).join('')}</div>

    if(!picked.length){toast('Tick at least one person');return}const tot=picked.reduce((s,r)=>s+r.amt,0);

    receiptsSheet(picked.map(r=>({name:r.t.name,amt:r.amt,text:receiptText(r.t.name,r.amt,r.via,d.iso,rentWhat(h,r.d.date),nextRentLine(r.t))})),`${h.name} rent saved`)});
  const f=document.querySelector('#sheet form'),tt=document.getElementById('crtot');
  const upd=()=>{let s=0,n=0;rows.forEach((r,i)=>{const on=f['c'+i].checked;f['a'+i].disabled=f['v'+i].disabled=!on;f['a'+i].closest('.crow').classList.toggle('off',!on);if(on){s+=+f['a'+i].value||0;n++}});tt.innerHTML=`${n} ticked · total <b>${money(s)}</b>`};
  if(f){f.addEventListener('input',upd);f.addEventListener('change',upd);upd()}}
function receiptsSheet(list,title){

  <div class="list">${list.map((r,i)=>{const ph=phoneOf(r.name);return `<div class="row"><div class="main"><div class="t">${esc(r.name)} · ${money(r.amt)}</div><div class="s" style="white-space:normal">${esc(r.text.length>110?r.text.slice(0,110)+'…':r.text)}</div></div><a class="btn sm pri" href="${ph?waLink(ph,r.text):'https://wa.me/?text='+encodeURIComponent(r.text)}" target="_blank" rel="noopener" data-msgwho="${esc(r.name)}" data-how="WhatsApp" data-text="${esc(r.text)}">WhatsApp</a></div>`}).join('')}</div>

/* ---------- NEW: check an account against the real balance ---------- */
function checkSheet(id){const a=S.assets.find(x=>x.id===id);if(!a)return;
  sheet(`<h2>Check ${esc(a.name)}</h2><div class="sub">${/cash/i.test(a.name)?'Count your cash':'Open your '+esc(a.name)+' app'} and type the real balance. The app finds the difference and fixes it.</div>
  <form class="f"><label>Real balance now<input name="real" type="number" inputmode="decimal" step="0.01" required placeholder="${n2(a.amount)}"></label>
  <div class="ckbox" id="ckd"><div><span>App says</span><b>${money(a.amount)}</b></div><div><span>Real</span><b id="ckr">–</b></div><div><span>Difference</span><b id="ckx">–</b></div></div>
  <div class="fld">What happened to the difference?<div class="chips"><label><input type="radio" name="how" value="rec" checked><span>Save it as spending / money in</span></label><label><input type="radio" name="how" value="set"><span>Just fix the number</span></label></div>
  <span style="font-weight:500;font-size:12px">“Save it” keeps your report and plan right. Use “Just fix” only if the app number was wrong.</span></div>
  <label>Note (optional)<input name="note" placeholder="e.g. card payments I forgot to add"></label>${actions('Fix balance')}</form>`,
  d=>{const real=Math.round((+d.real||0)*100)/100,diff=Math.round((real-a.amount)*100)/100,note=d.note.trim();
    if(Math.abs(diff)<0.005){commit(`${a.name} checked · matches ${n2(real)}`,()=>{a.checked=todayISO()});return}
    if(d.how==='rec')commit(`${a.name} check: ${diff<0?'spent':'money in'} ${n2(Math.abs(diff))} not recorded before`,()=>{S.expenses.unshift({id:uid('e'),kind:diff<0?'out':'in',iso:todayISO(),via:a.id,amt:Math.abs(diff),cat:diff<0?'Other spending':'Other income',note:note||'Found in balance check'});a.amount=real;a.updated=a.checked=todayISO()});
    else commit(`${a.name} balance: ${n2(a.amount)} → ${n2(real)} (checked)`,()=>{a.amount=real;a.updated=a.checked=todayISO()})});
  const f=document.querySelector('#sheet form');if(f)f.real.addEventListener('input',()=>{const v=f.real.value;if(v===''){document.getElementById('ckr').textContent=document.getElementById('ckx').textContent='–';return}
    const x=Math.round((+v-a.amount)*100)/100,el=document.getElementById('ckx');document.getElementById('ckr').textContent=m2(+v);el.textContent=Math.abs(x)<0.005?'✓ Matches':(x>0?'+':'−')+m2(Math.abs(x)).replace('−','');el.className=Math.abs(x)<0.005?'pos':x<0?'neg':'pos'})}

function txList(from,to){const out=[],inR=x=>x.iso>=from&&x.iso<=to,H=id=>(S.houses.find(h=>h.id===id)||{}),T=(hid,tid)=>((H(hid).tenants||[]).find(t=>t.id===tid)||{}).name||'Tenant';
  const add=(iso,type,who,det,amt,via)=>out.push({iso,type,who,det,amt:Math.round(amt*100)/100,acc:via==='offset'?'Taken off debt':via?accName(via):'Not tracked'});
  S.rentPayments.filter(p=>!p.pre&&inR(p)).forEach(p=>{const h=H(p.h);add(p.iso,h.kind==='car'?'Car rent in':'Rent in',T(p.h,p.t),`${h.name||''} · due ${p.due}`,p.amt,p.via)});
  S.entries.forEach(e=>e.payments.filter(inR).forEach(p=>add(p.iso,e.side==='get'?'Loan paid back to me':'I paid back',e.name,'',e.side==='get'?p.amt:-p.amt,p.via)));
  S.moves.filter(inR).forEach(m=>add(m.iso,m.amt<0?'I lent':'I borrowed',m.who,'',m.amt,m.via));
  S.landlordPaid.filter(p=>!p.pre&&inR(p)).forEach(p=>add(p.iso,'Rent to landlord',H(p.h).name||'',`due ${p.due}`,-p.amt,p.via));
  S.bills.filter(b=>bPaid(b)&&inR({iso:bPayDate(b)})).forEach(b=>PO(b).forEach(p=>add(bPayDate(b),'House bill',H(b.h).name||'',b.type+(b.note?' · '+b.note:''),-p.amt,p.via)));
  (S.shareIn||[]).filter(inR).forEach(x=>PO(x).forEach(p=>{const r=splitSrc(x.rec);add(x.iso,'Bill share in',x.name,r?r.name:'',p.amt,p.via)}));
  S.carCosts.filter(inR).forEach(c=>PO(c).forEach(p=>add(c.iso,'Car cost',carOf(c).plate||'',c.type+(c.note?' · '+c.note:''),-p.amt,p.via)));
  S.expenses.filter(inR).forEach(x=>PO(x).forEach(p=>add(x.iso,x.kind==='in'?'Money in':'Spending',x.cat,x.note||'',x.kind==='in'?p.amt:-p.amt,p.via)));
  S.transfers.filter(inR).forEach(t=>{add(t.iso,'Transfer out','',`to ${accName(t.to)}${t.note?' · '+t.note:''}`,-t.amt,t.from);add(t.iso,'Transfer in','',`from ${accName(t.from)}${t.note?' · '+t.note:''}`,t.amt,t.to)});
  return out.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:0)}
function csvSheet(){const ym=month;
  sheet(`<h2>Export to spreadsheet</h2><div class="sub">Makes a CSV file. It opens in Excel, Google Sheets or Numbers. Every payment, rent, bill, spending and transfer is one row.</div>
  <div class="btns" style="display:grid;gap:8px"><button class="btn pri" data-act="csvGo" data-v="month">${esc(monthLabel(ym))} only</button><button class="btn" data-act="csvGo" data-v="all">Everything (all time)</button></div>
  <div class="btns" style="margin-top:12px"><button class="btn" data-act="close" style="flex:1">Cancel</button></div>`)}
function csvGo(which){const [f,t]=which==='month'?monthRange(month):['0000-01-01','9999-12-31'];const rows=txList(f,t);
  if(!rows.length){toast('Nothing to export for that time');return}
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='﻿'+[['Date','Type','Who','Details','Amount','Account'],...rows.map(r=>[r.iso,r.type,r.who,r.det,r.amt.toFixed(2),r.acc])].map(r=>r.map(q).join(',')).join('\r\n');
  const name=`roys-ledger-${which==='month'?month:'all-'+todayISO()}.csv`;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);closeSheet();toast(`Saved ${rows.length} rows · check your Downloads`)}catch(e){copyText(csv)}}

/* ---------- backup & restore ---------- */
var actAll=false;
var SNAPKEY='dhiman-ledger-snaps';
function bkName(){return `roys-ledger-backup-${todayISO()}.json`}
function exportData(){return JSON.stringify({...S,undo:null,app:'roys-ledger',exportedAt:new Date().toISOString()})}
function bkCount(d){const rp=(d.rentPayments||[]).filter(x=>!x.pre).length,pays=(d.entries||[]).reduce((s,e)=>s+(e.payments||[]).length,0);
  return {people:(d.entries||[]).length,pays,rent:rp,log:(d.log||[]).length,transfers:(d.transfers||[]).length,spends:(d.expenses||[]).length,last:(d.log&&d.log[0])?d.log[0].iso:''}}
function readSnaps(){try{return JSON.parse(localStorage.getItem(SNAPKEY)||'[]')}catch(e){return []}}
function writeSnaps(a){try{localStorage.setItem(SNAPKEY,JSON.stringify(a))}catch(e){try{localStorage.setItem(SNAPKEY,JSON.stringify(a.slice(-3)))}catch(e2){}}}
function snapNow(label){const a=readSnaps();a.push({iso:new Date().toISOString(),label,data:exportData()});writeSnaps(a.slice(-10))}
function dailySnap(){const a=readSnaps(),d=todayISO();if(a.some(x=>x.label==='Daily'&&(x.d||x.iso.slice(0,10))===d))return;
  const daily=a.filter(x=>x.label==='Daily').slice(-6),keep=a.filter(x=>x.label!=='Daily').slice(-4);
  writeSnaps([...daily,{iso:new Date().toISOString(),d,label:'Daily',data:exportData()},...keep].sort((x,y)=>x.iso<y.iso?-1:1))}
function parseBackup(txt){
  txt=String(txt||'').trim().replace(/^﻿/,'');
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw new Error('No backup data found in this text.');
  let d;try{d=JSON.parse(txt.slice(a,b+1))}catch(e){throw new Error('The backup text is broken or cut off. Copy the whole text again.')}
  if(!d||!Array.isArray(d.entries)||!Array.isArray(d.assets))throw new Error('This file is not a Roy\'s Ledger backup.');
  return d}
function fmtWhen(iso){return iso?new Date(iso).toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'unknown'}
function restore(txt,src){let d;try{d=parseBackup(txt)}catch(e){toast(e.message);return}
  const n=bkCount(d),c=bkCount(S);
  const row=(l,a,b)=>`<tr><td>${l}</td><td>${b}</td><td${a<b?' class="neg"':''}><b>${a}</b></td></tr>`;
  const fewer=n.log<c.log||n.rent<c.rent||n.pays<c.pays;
  sheet(`<h2>Restore this backup?</h2><div class="sub">${esc(src||'Backup')} · last change in it: <b>${fmtWhen(n.last)}</b></div>
  <div class="tablewrap"><table class="ptable"><thead><tr><th></th><th>On phone now</th><th>In backup</th></tr></thead><tbody>
  ${row('People',n.people,c.people)}${row('Loan payments',n.pays,c.pays)}${row('Rent payments',n.rent,c.rent)}${row('Transfers',n.transfers,c.transfers)}${row('Spending / money in',n.spends,c.spends)}${row('Activity items',n.log,c.log)}</tbody></table></div>
  ${fewer?`<div class="save-warn" style="margin-top:10px">This backup has <b>less</b> data than your phone has now. It may be older. Your current data is saved first, so you can go back.</div>`:`<div class="mut" style="font-size:12.5px;margin-top:10px">Your current data is saved first as a safety copy, so you can go back.</div>`}
  <div class="btns" style="margin-top:12px"><button class="btn" data-act="close">Cancel</button><button class="btn pri" style="flex:1" id="okrestore">Restore</button></div>`);
  document.getElementById('okrestore').onclick=()=>{snapNow('Before restore');const snap=JSON.stringify({...S,undo:null});
    S=migrate(d);S.undo={label:'Restore backup',snap};S.log.unshift({iso:new Date().toISOString(),text:'Restored backup ('+n.log+' activity items)'});
    save();closeSheet();render();toast('Backup restored')}}
function markBackedUp(){S.lastBackup=todayISO();save();render()}
function downloadBackup(){const t=exportData();
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=bkName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    markBackedUp();toast('Backup file saved. Check your Downloads.')}catch(e){copyBackup()}}
async function shareBackup(){const t=exportData();
  try{const f=new File([t],bkName(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Roy's Ledger backup"});markBackedUp();toast('Backup shared');return}}catch(e){if(e&&e.name==='AbortError')return}
  downloadBackup()}
function copyBackup(){const t=exportData();markBackedUp();const ta=document.getElementById('bktext');if(ta)ta.value=t;copyText(t,ta)}
function vBackup(){const c=bkCount(S),snaps=readSnaps(),bd=S.lastBackup?toN(todayISO())-toN(S.lastBackup):null;
  return `<section><div class="sec-h"><h2>Backup</h2><span class="pill ${bd===null||bd>=3?'bad':'ok'}">${bd===null?'Never backed up':bd===0?'Backed up today':`${bd} day${bd>1?'s':''} ago`}</span></div><div class="card" style="display:grid;gap:12px">
  <div class="bkbox"><span class="label">On this phone</span><div style="font-size:13.5px;margin-top:2px"><b>${c.people}</b> people · <b>${c.pays+c.rent}</b> payments · <b>${c.transfers}</b> transfers · <b>${c.log}</b> activity items</div><div class="mut" style="font-size:12.5px;margin-top:2px">Last change: <b style="color:var(--ink)">${fmtWhen(c.last)}</b>${S.log[0]?' · '+esc(S.log[0].text):''}</div></div>
  <span class="mut" style="font-size:13px">Your data lives only in this browser. Save a backup file often and keep it in Google Drive, email or WhatsApp to yourself.</span>
  <div class="btns"><button class="btn pri" data-act="shareBackup">Save / share backup file</button><button class="btn" data-act="dlBackup">Download file</button><button class="btn" data-act="backup">Copy as text</button></div>
  <div class="btns"><label class="btn">Restore from file<input type="file" id="bkfile" accept=".json,application/json,text/plain,*/*" class="vh"></label><button class="btn" data-act="pasteRestore">Restore from text</button></div>
  <textarea class="bk" id="bktext" placeholder="Backup text appears here, or paste a backup here and tap Restore from text" spellcheck="false"></textarea>
  <div><span class="label">Safety copies on this phone</span><div class="mut" style="font-size:12px;margin:2px 0 6px">The app keeps a copy each day and before every restore. Use one if something goes wrong.</div>
  <div class="list">${snaps.length?snaps.map((x,i)=>({x,i})).reverse().map(({x,i})=>{let n={};try{n=bkCount(JSON.parse(x.data))}catch(e){}return `<div class="row"><div class="main"><div class="t">${esc(x.label)} · ${fmtWhen(x.iso)}</div><div class="s">${n.people??'?'} people · ${(n.pays||0)+(n.rent||0)} payments · ${n.log??'?'} activity</div></div><button class="btn sm" data-act="snapRestore" data-i="${i}">Restore</button></div>`}).join(''):'<div class="empty">No safety copies yet.</div>'}</div></div>
  </div></section>`}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- PIN lock ---------- */
const PINKEY='dhiman-ledger-pin';let pinHash=null,pinBuf='';try{pinHash=localStorage.getItem(PINKEY)}catch(e){}
function hpin(s){let h=2166136261;for(const c of 'dhiman-ledger:'+s+':pin'){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function showLock(){pinBuf='';document.getElementById('view').innerHTML='';document.getElementById('lock').innerHTML=`<div class="lock"><div><h2>Roy's Ledger</h2><div class="mut" style="margin-top:4px">Enter your PIN</div><div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'del'].map(k=>k===''?'<span></span>':`<button type="button" data-pin="${k}" aria-label="${k==='del'?'Delete':k}">${k==='del'?'⌫':k}</button>`).join('')}</div>
  <button type="button" class="btn sm" data-pin="forgot">Forgot PIN</button></div></div>`}
function pinPress(k){
  if(k==='forgot'){document.getElementById('lock').innerHTML=`<div class="lock"><div style="max-width:340px"><h2>Forgot PIN</h2><p class="mut">The only way in is to erase the data on this phone and start again. Then restore your latest backup from Report &amp; more.</p><div class="btns" style="justify-content:center"><button type="button" class="btn" data-pin="back">Go back</button><button type="button" class="btn pri" style="background:var(--owe);border-color:var(--owe)" data-pin="erase">Erase and start again</button></div></div></div>`;return}
  if(k==='back'){showLock();return}
  if(k==='erase'){try{localStorage.removeItem(PINKEY);localStorage.removeItem(KEY)}catch(e){}pinHash=null;S=migrate(JSON.parse(JSON.stringify(SEED)));save();document.getElementById('lock').innerHTML='';tab='more';render();toast('Erased. Restore your backup below.');return}
  pinBuf=k==='del'?pinBuf.slice(0,-1):(pinBuf+k).slice(0,4);
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
  if(pinBuf.length===4){if(hpin(pinBuf)===pinHash){document.getElementById('lock').innerHTML='';render()}else{const d=document.getElementById('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');pinBuf='';setTimeout(()=>document.querySelectorAll('#dots i').forEach(i=>i.classList.remove('on')),300)}}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-pin]');if(b)pinPress(b.dataset.pin)});
function pinSheet(){
  sheet(`<h2>Set a PIN</h2><div class="sub">4 numbers. Write it down. If you forget it, you need your backup to get back in.</div>
  <form class="f"><div class="two"><label>New PIN<input name="p1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label><label>Type it again<input name="p2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label></div>${actions('Turn on PIN')}</form>`,
  d=>{if(!/^\d{4}$/.test(d.p1)){toast('Use 4 numbers');return}if(d.p1!==d.p2){toast('The two PINs do not match');return}
    pinHash=hpin(d.p1);try{localStorage.setItem(PINKEY,pinHash)}catch(e){}closeSheet();render();toast('PIN is on')});
}
function vPin(){return `<section><div class="sec-h"><h2>PIN lock</h2></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
  <span>${pinHash?'PIN is <b class="pos">on</b>. The app asks for it when it opens.':'<span class="mut">No PIN. Anyone with your phone can open this.</span>'}</span>
  <div class="btns">${pinHash?'<button class="btn sm" data-act="lockNow">Lock now</button><button class="btn sm dan" data-act="pinOff">Turn off</button>':'<button class="btn sm pri" data-act="pinOn">Set PIN</button>'}</div></div></div></section>`}

/* if the built-in data is newer than what this browser saved, use the newer one (old one kept as a safety copy) */
(function(){try{const lastOf=d=>((d&&d.log||[]).find(l=>!/^Fixed: /.test(l.text))||{}).iso||'';const seedLast=lastOf(SEED),mine=lastOf(S);
  if(seedLast&&seedLast>mine){snapNow('Older data before update');S=migrate(JSON.parse(JSON.stringify(SEED)));S.undo=null;
    setTimeout(()=>toast('Loaded your latest data ('+fmtWhen(seedLast)+')'),400)}}catch(e){}})();
(function(){try{if(!matchMedia('(pointer:fine)').matches||!MOTION)return}catch(e){return}
  let cur=null;document.addEventListener('pointermove',ev=>{const c=ev.target.closest&&ev.target.closest('.pcard,.acc');
    if(cur&&cur!==c){cur.style.transform='';cur.style.removeProperty('--mx');cur=null}if(!c)return;cur=c;
    const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
    c.style.transform=`perspective(900px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translateY(-3px)`;c.style.setProperty('--mx',((x+.5)*100).toFixed(1)+'%')})})();
save();if(pinHash)showLock();else render();
